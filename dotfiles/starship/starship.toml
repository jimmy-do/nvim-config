# =============================================================================
#  TAIL — these ride seg_time, the pill's tail colour.
#
#  They reuse seg_time rather than introducing seg_* vars of their own ON PURPOSE:
#  starship-pill-themes.txt gives each theme exactly 7 colours (os|user|dir|git|
#  lang|devops|time), so an 8th field would invalidate every theme in that file.
#  Both are conditional and both sit before [time], so [time] still owns the cap.
# =============================================================================
[cmd_duration]
disabled = true
min_time = 500
show_milliseconds = false
style = "fg:seg_time bold"
format = "[ \U000f051b $duration ]($style)"

[jobs]
symbol = "✦ "
number_threshold = 1
symbol_threshold = 1
style = "fg:seg_time bold"
format = "[ $symbol$number ]($style)"

# =============================================================================
#  RIGHT CAP — time is always present, so it owns the cap
# =============================================================================
[time]
disabled = true
time_format = "%H:%M:%S"
style = "fg:seg_time bold"
format = "[ \U000f0954  ]($style)"

# =============================================================================
#  OFF-PILL
# =============================================================================
[status]
disabled = false
symbol = "✘"
style = "fg:color_red bold"
format = "[ $symbol$status]($style)"

[character]
disabled = false
success_symbol = "[ ❯](bold seg_time)"
error_symbol = "[ \\(╯°□°\\)╯ ❯](bold color_red)"
vimcmd_symbol = "[ ▓](bold color_green)"
vimcmd_replace_one_symbol = "[ ▓](bold color_yellow)"
vimcmd_replace_symbol = "[ ▓](bold color_yellow)"
vimcmd_visual_symbol = "[ ▓](bold color_cyan)"

# =============================================================================
#  PROFILES — MUST STAY LAST IN THIS FILE
#
#  Transient prompt: once you hit Enter, the finished prompt is repainted as this
#  profile, so scrollback keeps the command and drops the ~89-cell pill. Only the
#  live prompt stays full. starship 1.26 wires transience for fish/PowerShell/cmd
#  but NOT zsh (25 hits in the fish init, 0 in zsh), so zsh/starship-transient.zsh
#  drives it by hand off an accept-line widget. `--profile` is a first-class CLI
#  flag on every shell, so the mechanism is supported -- only the wiring is ours.
#
#  WHY LAST: [profiles] is a TOML table, so it swallows EVERY top-level key that
#  follows it. Put it above `palette` and `palette` silently becomes
#  profiles.palette -- the palette then never resolves, every seg_* colour dies,
#  and the whole prompt renders with no colour at all. That is not hypothetical;
#  it is exactly what happened when this block first landed at the top of the
#  file. Any new top-level key belongs ABOVE this block.
# =============================================================================
[profiles]
transient = "$character"
