Windows = "\U000f0372"
Ubuntu = "\U000f0548"
Debian = "\U000f08da"
Arch = "\U000f08c7"
Fedora = "\U000f08db"
Alpine = ""
Linux = "\U000f033d"
Raspbian = "\U000f043f"
Mint = "\U000f08ed"
Manjaro = ""
Redhat = "\U000f111b"
RedHatEnterprise = "\U000f111b"
Amazon = ""
Android = ""
CentOS = ""
Gentoo = "\U000f08e8"
Pop = ""
SUSE = ""
Artix = "\U000f08c7"
EndeavourOS = ""
AOSC = ""

# =============================================================================
#  MIDDLE — every module owns its leading wedge " " (ink on incoming color)
# =============================================================================
[username]
show_always = true
style_user = "fg:seg_user bold"
style_root = "fg:logo_git bold"
format = "[$user ]($style)"

[directory]
style = "fg:seg_dir bold"
format = "[ $path$read_only ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
