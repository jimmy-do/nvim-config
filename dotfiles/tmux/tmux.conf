# ==========================================
# 1. CORE SYSTEM CONFIGURATIONS & OVERRIDES
# ==========================================

# Change Prefix from Ctrl-b to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal capabilities. These must be set before plugins load, not after.
# terminal-features supersedes the old ",xterm-256color:Tc" override form:
#   RGB        truecolor (CRT/phosphor shader colors)
#   usstyle    undercurl + colored underlines in nvim
#   hyperlinks OSC 8 clickable links pass through to Ghostty
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB,*:usstyle,*:hyperlinks,*:extkeys"

# Extended keys: pass modifier combos the legacy encoding can't express
# (e.g. Ctrl+; for nvim command mode) through to apps via CSI u.
set -s extended-keys on

# Make tmux snappier (especially for Vim/Neovim Esc switching)
set -sg escape-time 0

# Forward terminal focus gain/loss to apps (nvim autoread, etc.)
set -g focus-events on

# Let apps' OSC sequences reach the terminal (Claude Code desktop notifications)
set -g allow-passthrough on

# Enable Mouse Support
set -g mouse on

# Scrollback depth. This was never set, so it silently sat on tmux's 2000-line
# default -- small enough that long build/test output scrolls away for good.
set -g history-limit 50000

# Vim-style copy mode settings
setw -g mode-keys vi
# mode-style (the copy-mode SELECTION) is generated -- see the
# tmux-copy-managed block. It was a hand-set pale cyan here for years and drifted
# away from every other copy-mode surface; `tmux-copy <colour>` owns it now.
bind -T copy-mode-vi v send -X begin-selection
# Pipe yanks directly to the macOS clipboard. OSC 52 is unreliable in floax's
# nested tmux client, while pbcopy works identically in both clients. Keep copy
# mode open so several values can be grabbed without re-entering and scrolling.
# copy-pipe still updates tmux's paste buffer, so `prefix ]` remains available.
bind -T copy-mode-vi y send -X copy-pipe "pbcopy" \; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner"
#
# ...and `y` was NOT the only key that copies. Every OTHER copy key -- Enter,
# mouse drag-release, double-click (word), triple-click (line), and emacs
# M-w/C-w -- ships bound to a BARE `copy-pipe-and-cancel` with no command, which
# falls straight back to tmux's OSC52 path and so dies in the float exactly
# the same silent way. Fixing only `y` fixed one key out of seven. Pipe them all.
#
# The DoubleClick/TripleClick pairs must be re-bound in the ROOT table too, not
# just copy-mode*: outside copy mode a double-click enters it with `copy-mode -H`
# and copies in one shot, and that root binding carries its own argless
# copy-pipe. Missing it means click-to-copy works in the main client and no-ops
# in the float -- the original bug, unchanged.
bind -T copy-mode-vi Enter               send -X copy-pipe "pbcopy" \; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner"
bind -T copy-mode-vi MouseDragEnd1Pane   send -X copy-pipe "pbcopy" \; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner"
bind -T copy-mode-vi DoubleClick1Pane    select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe "pbcopy" \; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner"
bind -T copy-mode-vi TripleClick1Pane    select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe "pbcopy" \; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner"
bind -T copy-mode    MouseDragEnd1Pane   send -X copy-pipe "pbcopy" \; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner"
bind -T copy-mode    DoubleClick1Pane    select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe "pbcopy" \; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner"
bind -T copy-mode    TripleClick1Pane    select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe "pbcopy" \; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner"
bind -T copy-mode    M-w                 send -X copy-pipe "pbcopy" \; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner"
bind -T copy-mode    C-w                 send -X copy-pipe "pbcopy" \; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner"
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send -X select-word ; run-shell -d 0.3 ; send -X copy-pipe-and-cancel "pbcopy" ; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner" }
bind -n TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send -X select-line ; run-shell -d 0.3 ; send -X copy-pipe-and-cancel "pbcopy" ; run-shell -b "$HOME/.config/nvim/dotfiles/tmux/yank-banner" }
# u/d and C-u/C-d are SWAPPED against both tmux's defaults and the earlier
# binding here: the bare keys now scroll a HALF page, the Ctrl keys a FULL one.
# Rationale: bare u/d then match what C-u/C-d do in vim proper, so the reflex
# transfers with no modifier -- and the full page, which you reach for less
# often, is the one that costs a chord.
#
# This is safe HERE and only here. copy-mode-vi has no undo and no delete
# operator, so u and d carry no other meaning. Do NOT mirror this into Neovim:
# there u is undo and d is the delete operator that dd/dw/diw/dap are built on.
# The jumps are animated line-by-line by smooth-scroll (the tmux answer to
# neoscroll.nvim) -- run-shell -b so the sleep-between-frames loop doesn't block
# the server. Divisor 2 = half page, 1 = full. Tune DURATION in the script.
bind -T copy-mode-vi u   run-shell -b "$HOME/.config/nvim/dotfiles/tmux/smooth-scroll #{pane_id} up   2"
bind -T copy-mode-vi d   run-shell -b "$HOME/.config/nvim/dotfiles/tmux/smooth-scroll #{pane_id} down 2"
bind -T copy-mode-vi C-u run-shell -b "$HOME/.config/nvim/dotfiles/tmux/smooth-scroll #{pane_id} up   1"
bind -T copy-mode-vi C-d run-shell -b "$HOME/.config/nvim/dotfiles/tmux/smooth-scroll #{pane_id} down 1"
bind -T copy-mode-vi Escape send -X cancel
# Pane navigation from inside copy mode. These must NOT fall through to the
# root table: the vim-tmux-navigator binding there tests the pane's running
# process, and copy mode is only an overlay -- so in an nvim pane it would
# send C-h to nvim underneath instead of switching panes. In copy mode we are
# never navigating nvim splits, so switch panes unconditionally.
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# status-keys emacs, globally and on purpose, even though mode-keys is vi.
# status-keys governs PROMPTS (search, command, rename), and with vi there
# Escape does not cancel -- it drops the prompt into a vi-normal editing state
# that reads as a glitched second menu. The wrappers that used to flip this
# per-prompt around copy-mode / and ? could not cover choose-tree's search
# prompt, whose keys are hardcoded in mode-tree.c, so the global default is
# the only fix that reaches every prompt. Escape now always means cancel.
set -g status-keys emacs
bind -T copy-mode-vi / command-prompt -T search -p '(search down)' { send-keys -X search-forward -- '%%' }
bind -T copy-mode-vi ? command-prompt -T search -p '(search up)' { send-keys -X search-backward -- '%%' }

# nohlsearch for copy mode. tmux has no clear-search command, but an empty
# incremental search term clears the match marks and the (N results) counter
# without moving the cursor -- unlike q/Escape, which cancel copy mode and
# snap you back to the bottom. C-l is taken by pane nav, so C-n it is.
bind -T copy-mode-vi C-n send -X search-forward-incremental ''

# Drop a bad selection without leaving copy mode. Escape and q are both cancel
# (deliberate, above), so they snap you back to the prompt and lose your scroll
# position. C-g clears the highlight only -- cursor and scrollback stay put, so
# you can re-select immediately. The stock C-[ binding for this is unusable:
# C-[ and Escape are the same byte, so whichever is bound last wins.
bind -T copy-mode-vi C-g send -X clear-selection

# ==========================================
# 2. WINDOWS & PANES LAYOUTS
# ==========================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window activity, using tmux's own indicator and nothing else.
#
# monitor-activity ON means #{window_flags} adds `#` to a window that has
# emitted output since you last looked at it -- the same one-cell vocabulary as
# - last, ! bell, Z zoomed, M marked, * current. No custom glyph, no dot, no
# label recolouring: the flag run in window-status-format already renders it.
#
# window-status-activity-style is the one thing that must NOT stay stock here.
# tmux ships it as `reverse`, applied ON TOP of window-status-format, which
# swaps fg and bg and repaints the whole label as a filled slab identical to the
# active-window chip -- several windows then read as several current windows.
# `default` leaves the label alone so the `#` in the flag run is the signal.
#
# window-status-bell-style: a bell is rare and deliberate -- a program decided
# you needed to know -- so it gets the loudest treatment on the bar: the whole
# label becomes a BLAST-RADIUS orange slab. Saturated + bright means the bloom
# shader makes it physically flare until the window is visited. (Was stock
# `reverse` for years; the explicit orange keeps the same loudness but feeds
# the glow, where reverse's colours depended on what they happened to invert.)
#
# Caveat worth knowing: `#` is set by ANY output and clears only by visiting the
# window, so on a machine running agents and logs it will be lit often. That is
# tmux telling the truth about a noisy machine rather than a display bug.
set -g monitor-activity on
set -g window-status-activity-style default
set -g window-status-bell-style "bg=#FF8500,fg=#080808,bold"

# ==========================================
# STATUS BAR CUSTOMIZATION
# ==========================================

set -g status-position top

# Main status bar background matches terminal background
set -g status 2
# 2026-07-28: seconds removed from the clock and interval raised from 1s. The 1s
# redraw was cheap for tmux but each redraw makes Ghostty re-run the 3-pass
# phosphor shader chain over the full display (Ghostty renders on any content
# update) -- at 2560x1440 that pinned the GPU ~70% and idled at 150F. 15s keeps
# status-context fresh without a per-second full-screen shader pass.
#
# 2026-08-10 -- THE PREMISE ABOVE HAS EXPIRED, left at 15 pending a decision.
# That number bought thermal headroom against the 3-pass PHOSPHOR shader chain at
# 2560x1440. Neither still holds: the live chain is cursor_tail + sonic_boom only
# (phosphor is retired -- `scripts/display-state.sh` reports the live chain), and
# the framebuffer is 1728x1080. Cost per redraw is a fraction of what it was.
# The visible price is that the clock is `%-l:%M %p`, so the displayed minute can
# lag reality by up to 15s and the rollover is visibly late.
# 5 would cut worst-case lag to 5s at 3x the redraws; status-context costs 18ms
# per refresh (measured), so that is ~11ms/s of extra shell work, not the shader
# pass this was originally guarding against.
# NOT changed unilaterally: this was a deliberate measured thermal call, and a
# screenshot cannot verify heat. Change the one number and watch idle temps.
set -g status-interval 15
set -g status-style "bg=default,fg=default"
set -g status-left-length 40
# status-right's length needs raising alongside status-left-length above -- it
# defaults to 40, which silently truncates a longer kube context (an EKS ARN,
# or gke_project_region_cluster) mid-string.
set -g status-right-length 120

# Window labels also blend with background
set -g window-status-style "bg=default,fg=default"
# Pane icons, matched on pane_current_command -- the live process, not a name
# you typed once. Anchored ^..$ so a pane sitting in a directory called "go" is
# not flagged, and the icon clears itself the moment the process exits.
#
# Codepoints are SHARED with @window_icon above wherever the two overlap (nvim,
# git, k8s, terraform, helm, docker, the agent icon, logs) so the pill and the
# rail speak one visual language. Every glyph here was verified present in
# JetBrainsMono Nerd Font by reading the cmap -- an unmapped one ships as a
# blank box, silently. Check before adding.
#
# Claude Code gets U+273B, the BIG asterisk from its banner -- not U+2733, the
# small one it spins in the title while working. It is NOT in JetBrainsMono Nerd Font (checked: 2733, 2734,
# 273B, 2731 all absent) and renders through Ghostty's font fallback, which is
# how it already appears in pane titles today. That makes it the one glyph here
# not covered by the cmap rule; if it ever shows as a blank box, fallback is
# what broke, not the table. 󰚩 (a generic robot) is kept for other agents --
# it was standing in for Claude and was never Claude's mark.
#
# A bare version number (2.1.216) is Claude Code too -- it reports its version
# as the process name rather than "claude", so the numeric pattern catches it.
#
# THERE IS NO SHELL ENTRY. A shell is the resting state of every pane, so an
# icon for it marked all of them and distinguished none -- the badge read as
# three glyphs before the first word. Anything unmatched falls through to no
# icon at all; the pill is a label, not an inventory.
set -g @pane_icon "#{?#{m/ri:^(nvim|vim)$,#{pane_current_command}},,#{m/ri:^(git|lazygit|tig)$,#{pane_current_command}},󰙅,#{m/ri:^(kubectl|k9s|kubens|kubectx)$,#{pane_current_command}},󱃾,#{m/ri:^(terraform|tofu|tf)$,#{pane_current_command}},󱁢,#{m/ri:^(helm)$,#{pane_current_command}},󰠳,#{m/ri:^(docker|podman|lazydocker)$,#{pane_current_command}},󰡨,#{m/ri:^(claude|claude-code)$,#{pane_current_command}},✻,#{m/ri:^[0-9]+\.[0-9.]+$,#{pane_current_command}},✻,#{m/ri:^(codex|aider|opencode)$,#{pane_current_command}},󰚩,#{m/ri:^(tail|less|bat|more)$,#{pane_current_command}},,#{m/ri:^(python|python3|ipython|uv)$,#{pane_current_command}},,#{m/ri:^(node|npm|pnpm|yarn|bun|deno)$,#{pane_current_command}},,#{m/ri:^(cargo|rustc)$,#{pane_current_command}},,#{m/ri:^(go|gopls)$,#{pane_current_command}},,#{m/ri:^(psql|mysql|sqlite3|redis-cli)$,#{pane_current_command}},,#{m/ri:^(man|tldr)$,#{pane_current_command}},󰗚,#{m/ri:^(htop|btop|top)$,#{pane_current_command}},󰨋,#{m/ri:^(make|gmake|cmake|ninja)$,#{pane_current_command}},󰫑,#{m/ri:^(fzf|rg|fd|ag)$,#{pane_current_command}},,#{m/ri:^(curl|wget|http)$,#{pane_current_command}},󰫄,#{m/ri:^(ssh|mosh|sudo|doas|su)$,#{pane_current_command}},󰢹,#{m/ri:^(tmux)$,#{pane_current_command}},,}"

set -g @window_icon "#{?#{m/ri:repo|git,#{window_name}},󰙅,#{m/ri:nvim|vim,#{window_name}},,#{m/ri:k8s|kube|kubectl,#{window_name}},󱃾,#{m/ri:terraform|tf,#{window_name}},󱁢,#{m/ri:helm,#{window_name}},󰠳,#{m/ri:argo|argocd,#{window_name}},,#{m/ri:log|logs,#{window_name}},,#{m/ri:codex,#{window_name}},󰚩,#{m/ri:docker|compose,#{window_name}},󰡨,#{m/ri:starship,#{window_name}},,}"

# Every coloured piece of the bar lives in the block below, generated by
# `tmux-bar <color>` (bin/tmux-color) from the same pill_* palette the prompt
# uses. One colour in, two out: bright for the session cap, the active window,
# values and dividers; 48% of it for labels and inactive windows.
#
# Row 1 is dual-purpose. In resize mode it is the keybind cheatsheet; the rest
# of the time the else-branch draws a full-width rule in the dim colour -- a
# scanline under the bar that matches the pane dividers. The row was already
# allocated by `status 2`, so this costs nothing.
#
# Active window marker variants (edit the template in bin/tmux-color, not here):
#   Best:             > #{E:@window_icon} #I:#W  (arrow / chevron / bare >)
# >>> tmux-bar-managed >>>  DO NOT EDIT BY HAND -- rewritten by `tmux-bar`
# bright = #00ffc8   active / values / dividers
# dim    = #007a60   labels / inactive / unlit
set -g status-format[1] "#{?#{==:#{client_key_table},resize},#[fg=#FF2E97]#[bg=default]#[fg=#080808]#[bg=#FF2E97]#[bold] RESIZE #[fg=#FF2E97]#[bg=default]#[nobold]  #[fg=#00ffc8]#[bg=default]h/j/k/l#[fg=#007a60] 1 cell  ·  #[fg=#00ffc8]H/J/K/L#[fg=#007a60] 5 cells  ·  #[fg=#00ffc8]Esc / q / Enter#[fg=#007a60] done,#{?client_prefix,#[fg=#00ffc8]|#[fg=#007a60] split  ·  #[fg=#00ffc8]-#[fg=#007a60] split  ·  #[fg=#00ffc8]o#[fg=#007a60] float  ·  #[fg=#00ffc8]g#[fg=#007a60] sesh  ·  #[fg=#00ffc8]f#[fg=#007a60] find  ·  #[fg=#00ffc8]/#[fg=#007a60] keys  ·  #[fg=#00ffc8]r#[fg=#007a60] resize  ·  #[fg=#00ffc8]t#[fg=#007a60] weather,#{?#{==:#{pane_mode},tree-mode},#[fg=#00ffc8]Enter#[fg=#007a60] go  ·  #[fg=#00ffc8]+/-#[fg=#007a60] fold  ·  #[fg=#00ffc8]C-s#[fg=#007a60] search  ·  #[fg=#00ffc8]n/N#[fg=#007a60] match  ·  #[fg=#00ffc8]f#[fg=#007a60] filter  ·  #[fg=#00ffc8]m#[fg=#007a60] mark  ·  #[fg=#00ffc8]t#[fg=#007a60] tag  ·  #[fg=#00ffc8]:#[fg=#007a60] cmd  ·  #[fg=#00ffc8]x#[fg=#007a60] kill  ·  #[fg=#00ffc8]O#[fg=#007a60] sort  ·  #[fg=#00ffc8]S-↑↓#[fg=#007a60] move win  ·  #[fg=#00ffc8]C-a ?#[fg=#007a60] HELP  ·  #[fg=#00ffc8]q#[fg=#007a60] out,#{?pane_in_mode,#[fg=#00ffc8]#{scroll_position}#[fg=#007a60] up  ·  #[fg=#00ffc8]n/N#[fg=#007a60] match  ·  #[fg=#00ffc8]v#[fg=#007a60] select  ·  #[fg=#00ffc8]y#[fg=#007a60] yank  ·  #[fg=#00ffc8]Esc#[fg=#007a60] out,#{?window_zoomed_flag,#[fg=#FF2E97]#[bg=default]#[fg=#080808]#[bg=#FF2E97]#[bold]  ZOOMED #[fg=#FF2E97]#[bg=default]#[nobold]  #[fg=#00ffc8]#{pane_current_command}#[fg=#007a60] · #{b:pane_current_path}  #[fg=#007a60]prefix z restores,#{?@dimzoom,#[fg=#FF2E97]#[bg=default]#[fg=#080808]#[bg=#FF2E97]#[bold]  TALL #[fg=#FF2E97]#[bg=default]#[nobold]  #[fg=#00ffc8]#{pane_current_command}#[fg=#007a60] · #{b:pane_current_path}  #[fg=#007a60]prefix Z restores,#[fg=#00ffc8]#[bg=default]#{R:═,#{client_width}}#[align=right]#[fg=#007a60]  #{window_panes} pane#{?#{>:#{window_panes},1},s,}  ·  #{session_windows} win  ·  #{client_width}×#{client_height}  }}}}}}"
set -g popup-border-style "fg=#007a60"
set -g menu-border-style  "fg=#007a60"
set -g copy-mode-mark-style "bg=#00ffc8,fg=#080808"
set -g @ui-bright "#00ffc8"
set -g @ui-dim "#007a60"
set -g @ui-sunk "#003328"
# <<< tmux-bar-managed <<<

# What is written ON the bar -- the inactive window labels and their rail, and
# @msg_unread is set by the `msg --watch` daemon and cleared the moment the msg
# TUI opens, so the count means "arrived since you last looked". It sits first
# in status-right, ahead of the git/language context, so it holds one fixed
# position instead of sliding around as that context changes width. The #{?...}
# wrapper collapses the whole chip to nothing when the option is 0 or unset --
# a bare #{@msg_unread} would leave a floating icon and a stray gap.
#
# status-right: git/language context, the date, the clock chip. `tmux-color`
# owns these; `tmux-bar` above owns the frame they sit in. The two names used
# to paint the same block (an unrecognised argv[0] fell through to tmux-bar),
# which is why this block is younger than the one above it.
# >>> tmux-color-managed >>>  DO NOT EDIT BY HAND -- rewritten by `tmux-color`
# bright = #2ff5ff   active / values / dividers
# dim    = #16757a   labels / inactive / unlit
set -g status-right "#{?@msg_unread,#[fg=#00e676]#[bg=default]󰭹 #{@msg_unread}  ,}#(~/.config/nvim/dotfiles/tmux/status-context '#{pane_current_path}')#[fg=#16757a]#[bg=default]%a %-m/%-d #{?@plain_clock,#[fg=#2ff5ff]#[bg=default]#[bold]%-l:%M %p#[nobold],#[fg=#2ff5ff]#[bg=default]#[dim]#[nodim]#[fg=#080808]#[bg=#2ff5ff]#[bold]%-l:%M %p#[fg=#2ff5ff]#[bg=default]#[nobold]#[dim]#[nodim]}"
set -g @bar_bright "#2ff5ff"
set -g @bar_dim "#16757a"
set -g window-status-separator "#[fg=#16757a]  #[default]"
set -g window-status-format "#[fg=#16757a]#[bg=default]#{?window_last_flag,#[fg=#16757a]   ,    }#{E:@window_icon} #I:#W#{?window_bell_flag,#[fg=#2ff5ff] 󰂒,#{?#{&&:#{window_activity_flag},#{==:#{m/ri:^(n?vim)$,#{pane_current_command}},0}},#[fg=#{?@session_hue_lit,#{@session_hue_lit},#{@session_hue}}] 􀀀,  }} #[default]"
# <<< tmux-color-managed <<<

# @plain_clock: Linux boxes get the clock as plain bold text -- no pill caps,
# no chip fill. The Mac keeps the pill. The clock segment of status-right
# above branches on it. Set here, outside the managed block, so a `tmux-color`
# rewrite never drops it.
if-shell '[ "$(uname -s)" = Linux ]' 'set -g @plain_clock 1'

# The session chip and the active-window chip are their own surface --
# `tmux-chip <color>`. Same colour as the bar reads as one piece; a
# different one makes the chips pop off it. Shapes are fixed either way.
# >>> tmux-chip-managed >>>  DO NOT EDIT BY HAND -- rewritten by `tmux-chip`
# bright = #73d0ff   active / values / dividers
# dim    = #37637a   labels / inactive / unlit
# tabstyle = slab   lit slab, sheared both ends (the original)
set -g @session_hue "#73d0ff"
set -g status-left "#[fg=#080808,bg=#{@session_hue},bold] #{?@session_upper,#{@session_upper},#{session_name}} #[fg=#{@session_hue},bg=default,nobold]#[dim]#[nodim]#[default] #{prefix_highlight} "
set -g window-status-current-style "bg=default,fg=#{@session_hue},bold"
set -g window-status-current-format "#[fg=#{?@session_hue_lit,#{@session_hue_lit},#{@session_hue}},bg=default]#[dim]#[nodim]#[fg=#080808,bg=#{?@session_hue_lit,#{@session_hue_lit},#{@session_hue}},bold] > #[fg=#080808,bg=#{?@session_hue_lit,#{@session_hue_lit},#{@session_hue}},bold]#{E:@window_icon} #I:#W #[fg=#{?@session_hue_lit,#{@session_hue_lit},#{@session_hue}},bg=default,nobold]#[dim]#[nodim]#[default] "
# <<< tmux-chip-managed <<<

# Session identity hues: assign each session its deterministic chip colour
# (see session-hue and the note in the tmux-chip template). Runs at load for
# sessions that already exist, and on session-created for new ones. Hook set
# without -a so re-sourcing replaces rather than stacks.
run-shell -b '~/.config/nvim/dotfiles/tmux/session-hue'

# Incoming-iMessage banners while the prefix-m popup is closed. Singleton by
# pidfile, so re-running this config on every reload can't stack daemons, and
# it stays silent whenever the msg TUI is actually on screen.
run-shell -b '~/.config/bin/msg --watch'

# The active window chip FLICKERS like a tube -- a fast dip and recovery when
# you land on a window, never a steady rhythm. The shader's bloom follows the
# colour down and back, so the halo snaps with it; static styling cannot do
# that, because the halo is scaled by the source pixel's own colour.
#
# Event-driven, NOT a background daemon. It used to be a loop that woke every
# 20-30s forever, whether you were switching windows or just sitting in one
# working -- burning wakeups to flicker a chip nobody's eyes were on. Now it
# only runs off these hooks: once when you arrive at a window, once when a
# client attaches. Stay put and it stays quiet; nothing is asleep in between.
#   tmux set -g @chip_flicker off      stop it
set-hook -g after-select-window 'run-shell -b "~/.config/nvim/dotfiles/tmux/chip-flicker"'
# client-attached itself is hooked separately below (ghost-border cleanup) --
# that `set-hook -g` with no index/-a REPLACES the whole array on every
# reload, so ours has to be appended with -a *after* that one runs, not set
# here, or it gets wiped out the moment the file finishes sourcing.
set-hook -g session-created 'run-shell -b "~/.config/nvim/dotfiles/tmux/session-hue"'
# Renaming a session has to re-run this too. The hue is derived FROM the name
# (hue_for matches on k8s/docker/terraform substrings, else hashes the name), so
# without this a renamed session kept the old session's colour until the next
# server restart -- and since 2026-08-10 it also carries @session_upper, the
# precomputed pill label, which would otherwise show the pre-rename name.
set-hook -g session-renamed 'run-shell -b "~/.config/nvim/dotfiles/tmux/session-hue"'

# set -g status-style bg=180
# Windows management (keeping current directory path)
bind c new-window -c "#{pane_current_path}"

# Ctrl-y toggles a narrow YouTube column in the current window: search above,
# inline video below. Prefix-y is intentionally retired -- it needs no unbind,
# having no default binding in the first place. The same was true of the
# unbinds that used to sit here for g, u and a: all four were no-ops. Note that
# an unbind here cannot undo a plugin's key anyway, since TPM runs at the foot
# of this file; that is what the post-plugin override block near the end is for.
# prefix C-o (rotate-window) is a tmux default that fires by accident whenever
# Ctrl is still held from the C-a prefix, shuffling panes mid-keystroke. Plain
# C-o is nvim's jumplist-back, so dropping this leaves that the only meaning.
# Rotating is still available from the prefix-w tree when it is actually wanted.
unbind C-o

# The mirror of the C-o problem: detach is only ever bound to plain d, so
# keeping Ctrl held from the C-a prefix lands on an unbound C-d, which tmux
# swallows silently. Binding it here means detach works with or without Ctrl.
# No EOF risk: C-d only reaches this table after the prefix.
bind C-d detach-client

unbind -n C-y
bind -n C-y run-shell '~/.config/nvim/dotfiles/tmux/yt-corner "#{pane_id}" "#{window_id}"'
# Cmd+h/l/; and Cmd+Shift+; from Ghostty send custom CSI sequences registered as tmux user keys.
set -s user-keys[0] "\e[5;30012~"
set -s user-keys[1] "\e[5;30013~"
set -s user-keys[2] "\e[5;30014~"
set -s user-keys[3] "\e[5;30015~"
bind -n User0 previous-window
bind -n User1 next-window
bind -n User2 last-window
# Guarded: inside the float this would repoint the FLOAT's client at another
# session, rendering your real session nested inside the 80% frame. See the
# FLOAT GUARD block at the end of this file.
bind -n User3 if-shell -F '#{==:#{session_name},floax}' \
  'run-shell "~/.config/nvim/dotfiles/tmux/banner red 2500 \"IN THE FLOAT  ·  prefix o to exit, then switch\""' \
  'switch-client -l'

# ⛔ DO NOT wrap MouseDown1Status in an if-shell. Tried 2026-07-31 to extend
# the float guard to clicks; it BREAKS clicking outright. if-shell does not
# expand formats in its command strings, so select-window received the literal
# text and every click printed a green "Can't find window: #{mouse_window_index}".
# tmux's own `-t=` mouse target fails the same way -- the mouse context does not
# survive into the deferred command.
#
# The line below RESTATES tmux's default. It is load-bearing: deleting a `bind`
# from this file does NOT unbind it in a running server (sourcing only adds and
# overwrites), so the broken wrapper survived every reload and clicking stayed
# dead until this key was explicitly overwritten. Keep it.
bind -n MouseDown1Status select-window -t=

# M-h / M-l switch windows. Rebound 2026-10-09 for Linux, where the User0/User1
# path above is dead: GNOME grabs Super+h / Super+l before Ghostty sees them.
# `bind -n` is unconditional and global, so these two steal Alt+h / Alt+l from
# every program running inside tmux -- including nvim's <M-h>/<M-l> width
# resize and cmdline word motions (see lua/config/keymaps.lua).
#
# NOTE FOR THE MAC (2026-10-11): this file is shared, so these two binds are
# live there as well. macOS already switches windows with Cmd+h / Cmd+l (the
# User0/User1 path above), so on the Mac they add nothing and only take
# Option+h / Option+l away from nvim. Jimmy's call: left as is. If that ever
# bites on the Mac, wrap the two lines in `if-shell '[ "$(uname)" = Linux ]'`.
bind -n M-h previous-window
bind -n M-l next-window
# prefix w -- tmux's built-in tree, restored after the fzf tree-pick attempt
# was rejected (vim motions j/k work here natively; fzf's query field ate them).
# The long -F format below exists because choose-tree draws THREE row types
# (session, window, pane) through ONE format, so it has to branch on which one
# it is rendering -- #{?pane_format,...} is true only on pane rows,
# #{?window_format,...} only on window rows, and the last branch is the session.
# The pane branch uses the same "is it named" test as pane-border-format: tmux
# has no unset title, so a title equal to the hostname or empty means unnamed.
# NB panes are COLLAPSED here -- + expands, - collapses, O sorts, F1 is help.
#
# Colour hierarchy: sessions are bold BRIGHT with a DIM window count and a
# session-hue ● when attached; window rows keep default fg for the name with a
# dim index and bright flags; pane rows are dim for bare commands and take the
# session hue when the pane carries a real (user-set) title. The selection bar
# is the global mode-style, which `tmux-copy` owns.
#
# These were baked hexes -- an amber/cyan pair from a palette retired twice over,
# still claiming to be "the house palette" in this very comment. They read the
# OPTIONS now (@ui-bright / @ui-dim from tmux-bar, @session_hue from tmux-chip),
# which tmux expands inside #[] in a FORMAT -- the same trick pane-border-format
# uses for #{@copy_mode_color}. Recolouring now reaches the tree too.
# Style escapes avoid commas inside #[] on purpose -- a comma there would
# terminate the surrounding #{?...}.
bind w if-shell -F '#{==:#{session_name},floax}' {
  run-shell "~/.config/nvim/dotfiles/tmux/banner red 2500 \"IN THE FLOAT  ·  prefix o to exit, then switch\""
} {
  choose-tree -Zw -F '#{?pane_format,#{?pane_marked,#[fg=#{@session_hue}]#[bold]  #[nobold],}#[fg=#{@ui-dim}]#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},}},#{pane_current_command},#[fg=#{@session_hue}]#{pane_title}},#{?window_format,#[fg=#{@ui-dim}]#{window_index}:#[default] #{window_name}#[fg=#{@ui-bright}]#{window_flags},#[fg=#{@ui-bright}]#[bold]#{session_name}#[nobold] #[fg=#{@ui-dim}]· #{session_windows} windows#{?session_attached, #[fg=#{@session_hue}]●,}}}' 'run-shell "~/.config/nvim/dotfiles/tmux/tree-grab \"%%\""'
}
# ^ the template (last arg) replaces the stock `switch-client -t %%` on Enter:
# tree-grab keeps that behaviour for every row EXCEPT the float session, whose
# rows Enter now PULLS into the session you opened the chooser from (via
# pane-move's crash-guarded `pull` verb). choose-tree has no bindable key
# table, so Enter's template is the only in-chooser hook that exists.

# tree-pick (fzf pane switcher), parked here pending a redesign -- its verbs
# (join/swap/break/kill via tree-act) all work; the UI was the problem.
bind C-w display-popup -E -b none -x C -y 2 -w 90% -h 80% \
  '~/.config/nvim/dotfiles/tmux/tree-pick'

# The same join/swap moves tree-pick offers, available from a bare prefix when
# you already know which pane is marked and do not need to look at a list.
# Mark a pane with `m` inside tree-pick (Alt-m) -- tmux's default mark key,
# prefix-m, is this config's Messages popup, and plain J is resize-pane -D in
# the hjkl resize family below, so both obvious keys were already spent.
# `!` is tmux's own default for the reverse: pane -> its own new window.
# Routed through pane-move, NOT join-pane directly: tmux 3.7b SEGFAULTS when a
# move destroys a window while any mode tree is open on the server
# (window_tree_build <- mode_tree_resize <- layout_fix_panes <- join-pane).
# That is what killed the server on 2026-08-13. The wrapper closes every mode
# tree first, and re-creates the floax session when the move empties it. Full
# write-up and the crash backtrace are in the script.
bind C-j run-shell "$HOME/.config/nvim/dotfiles/tmux/pane-move join-v '#{pane_id}'"
bind M-j run-shell "$HOME/.config/nvim/dotfiles/tmux/pane-move join-h '#{pane_id}'"

# sesh: zoxide-backed session/dir switcher in a popup. Prefix-g ("go").
# Lowercase s stays the built-in session chooser; this is additive.
# Body lives in scripts/sesh-pick so the float guard can wrap it -- see the
# FLOAT GUARD block below for why every session switcher is gated.
bind g if-shell -F '#{==:#{session_name},floax}' \
  'run-shell "~/.config/nvim/dotfiles/tmux/banner red 2500 \"IN THE FLOAT  ·  prefix o to exit, then switch\""' \
  'display-popup -E -x C -y 2 -w 60% -h 60% "~/.config/nvim/dotfiles/tmux/sesh-pick"'

# Toggle a persistent scratch SESSION -- the non-popup counterpart to prefix o.
# Same content model as the float (a session that outlives the toggle), but it
# lands in a real full-size window instead of an 80% frame. Press T again, or
# just `exit`, to come back; the script sets detach-on-destroy so exit no longer
# takes the Ghostty window down with it. Guarded like every other switch-client.
bind T if-shell -F '#{==:#{session_name},floax}' \
  'run-shell "~/.config/nvim/dotfiles/tmux/banner red 2500 \"IN THE FLOAT  ·  prefix o to exit, then switch\""' \
  'run-shell "~/.config/nvim/dotfiles/tmux/scratch-toggle"'

# Save the session with Resurrect and show its confirmation banner. Lowercase s
# stays the built-in session chooser; Prefix-Ctrl-s still works too, that being
# tmux-resurrect's own default save key (not TPM's -- TPM uses I / U / M-u).
bind S run-shell '~/.config/nvim/dotfiles/tmux/session-save'

# RENAME, one family, smallest unit on the shifted key:
#   prefix ,   rename window     (tmux default)
#   prefix <   rename PANE       (this -- Shift of the window key)
#   prefix $   rename session    (tmux default)
#
# `<` was tmux's window display-menu. Nothing is lost: that menu is still on
# right-click over a window label in the status bar (MouseDown3Status), and the
# pane menu is still on `>` and on right-click over a pane.
#
# -I seeds the prompt with the current name so you edit instead of retyping.
# @pane_name is empty when unnamed, so the seed is empty for free -- no need for
# the old test that stripped tmux's default hostname title back out. Submitting
# an empty value clears the option, which pane-border-format reads as "no name"
# and falls back to command · path, so this key is still its own reset.
#
# The name is stored in the pane-local user option @pane_name, NOT via
# `select-pane -T`. A pane_title is writable by anything running in the pane
# through an OSC escape -- Ghostty's shell integration rewrites it on every
# prompt -- so a hand-set title reverted within seconds. Nothing inside the pane
# can reach a user option, so a name set here stays set.
bind < command-prompt -I "#{E:@pane_name}" \
  -p "pane name:" "set -p @pane_name '%%'"

# Search the custom terminal keybind reference in a self-closing popup.
# -b none for the same reason as `bind f` below: the keys palette draws its own
# rounded, labelled fzf frame (keybind-palette.zsh, --border=rounded
# --border-label=' KEYBIND REFERENCE '), so tmux's popup frame stacked a second
# box around it. That doubling was invisible while the popup-clipping bug ate
# tmux's top border rows, and became obvious once the patched tmux drew them.
bind / display-popup -E -b none -x C -y C -w 92% -h 88% -d "#{pane_current_path}" \
  "zsh -f -c 'source ~/.config/nvim/dotfiles/zsh/terminal-tools.zsh; keys'"

# Tree help on prefix ?. The tree's own help keys are unreachable here: F1 is
# the Mac brightness key unless fn-keys are flipped, and its C-h alias loses to
# the vim-navigator root binding. The prefix still reaches the server inside
# tree mode, so this popup opens the palette's tree section OVER the open tree.
# Outside the tree, ? keeps its default meaning (list-keys -N).
bind ? if-shell -F '#{==:#{pane_mode},tree-mode}' {
  display-popup -E -b none -x C -y C -w 92% -h 88% "zsh -f -c 'source ~/.config/nvim/dotfiles/zsh/terminal-tools.zsh; keys tree'"
} {
  list-keys -N
}

# Search text visible across every pane, then jump directly to the match.
unbind f
# -b none: this script's fzf draws its own rounded, labelled border, so tmux's
# popup frame would stack a second box outside it. One border, not two.
bind f display-popup -E -b none -x C -y 2 -w 95% -h 88% \
  '~/.config/nvim/dotfiles/tmux/pane-content-picker'

# Open the terminal Messages client below the two-line top status.
bind m display-popup -E -x C -y 2 -w 90% -h 88% -d "#{pane_current_path}" '~/.config/bin/msg'

# prefix p: 1Password picker. Enter copies the field, Ctrl-P types it straight
# into the pane you came from. Secrets are never rendered in the popup -- the
# preview lists field names only -- so nothing lands in scrollback.
bind p display-popup -E -b none -x C -y C -w 80% -h 70%   "~/.config/nvim/dotfiles/tmux/op-pick '#{pane_id}'"

# Hourly weather for San Jose (replaces the built-in clock-mode on prefix t).
#
# UPSTREAM BUG, PATCHED LOCALLY -- this binding needs no workaround.
# tmux 3.7b clipped popups AND menus against a rectangle displaced downward by
# the number of TOP status lines, so with status-position top + `status 2` the
# top TWO rows were unguarded: a pane writing output while a popup was open
# painted over them and ate the ╭───╮ border. Rows lost == top status-line count.
# Cause: screen-redraw.c:1369 asks tty_check_overlay_range() about window-space
# `wy` but draws at tty-space `py`; with a top status bar those differ by exactly
# the status-line count. Fixed in the local build (4 hunks in screen-redraw.c,
# plus an out-of-bounds ranges read in popup.c:259). Verified by tmux's own -vv
# redraw log and a rendered-screen harness at status 1/2/3, top and bottom.
#
# Do NOT "fix" this in config by pinning -y 0. That only moves the popup's top
# rows onto the status bar, trading pane-bleed for status-bleed -- status-interval
# and mode-dots-loop's refresh-client -S repaint the bar over the rounded corners
# -- and it costs the centring too. Config cannot fix this; only the patch can.
unbind t
bind t display-popup -E -x C -y C -w 90 -h 19 '~/.config/nvim/dotfiles/tmux/weather --popup'

# Split panes natively using visual pipes/dashes. `-N` descriptions make all
# three entries visible in tmux's Prefix-? key-binding menu.
unbind '"'
unbind %
bind -N "split beside current pane" | split-window -h -c "#{pane_current_path}"
bind -N "split below current pane" - split-window -v -c "#{pane_current_path}"
bind -N "split full-width below all panes" _ split-window -v -f -c "#{pane_current_path}"

# Jump to last-used pane/window
bind-key ';' last-pane
bind-key 'C-;' last-pane
bind -n M-';' last-window
# Navigate between panes cleanly using lowercase Vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix q overlays the big pane numbers. tmux's default 1s timeout is shorter
# than it takes to read them on a busy layout, so the overlay vanishes mid-look
# and the digit you then press falls through to the pane instead. 4s is long
# enough to actually pick; any key still dismisses it immediately.
set -g display-panes-time 4000

# Jump straight to a pane by number -- M-1 .. M-9, no prefix.
#
# h/j/k/l are DIRECTIONAL: reaching a pane means thinking about the layout and
# pressing a chord once per hop, which is fine at two panes and turns into
# key-spamming at five. This is positional instead -- the number you press is
# the number already drawn in the pane's own border pill, so there is nothing
# new to learn or remember.
#
# Root table (no prefix) on purpose: with the prefix this would be no cheaper
# than the h/j/k/l it replaces. M-<digit> is free -- prefix <digit> is taken by
# select-window and stays that way, so windows are prefix+N and panes are M-N.
# M-';' next door is already last-window in the root table, so this matches.
#
# pane-base-index is 1, so M-1 is pane 1 with no off-by-one.
bind -n M-1 select-pane -t :.1
bind -n M-2 select-pane -t :.2
bind -n M-3 select-pane -t :.3
bind -n M-4 select-pane -t :.4
bind -n M-5 select-pane -t :.5
bind -n M-6 select-pane -t :.6
bind -n M-7 select-pane -t :.7
bind -n M-8 select-pane -t :.8
bind -n M-9 select-pane -t :.9

# vim-tmux-navigator: Ctrl+h/j/k/l crosses nvim splits AND tmux panes seamlessly.
# If the focused pane is running vim/nvim/fzf, forward the key; otherwise switch panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
# No-wrap 2026-07-26: at a window edge, plain select-pane WRAPS to the opposite
# side (or reselects the same full-width pane), firing focus in/out events that
# strobe nvim's focus handlers and the divider hooks — seen as flicker on C-l in
# the rightmost pane. At the edge: do nothing. Paired with tmux_navigator_no_wrap
# in nvim's tmux-navigator.lua for the vim-side half of the same move.
bind -n C-h if-shell "$is_vim" 'send-keys C-h'  "if -F '#{pane_at_left}'   '' 'select-pane -L'"
bind -n C-j if-shell "$is_vim" 'send-keys C-j'  "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind -n C-k if-shell "$is_vim" 'send-keys C-k'  "if -F '#{pane_at_top}'    '' 'select-pane -U'"
bind -n C-l if-shell "$is_vim" 'send-keys C-l'  "if -F '#{pane_at_right}'  '' 'select-pane -R'"
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
# Ctrl+l is now claimed above, so keep clear-screen on prefix + Ctrl+l
bind C-l send-keys 'C-l'

# Resize panes fluidly using repeatable Capital Vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Single-axis zoom, the counterpart to plain prefix-z. Z grows the pane to the
# full window height and leaves its width alone. Pressing again restores the
# exact layout from before, not an even-* preset.
bind Z run-shell '~/.config/nvim/dotfiles/tmux/dim-zoom "#{pane_id}" v'
# prefix z keeps its stock meaning, but routes through the same script so that
# entering real zoom cancels tall mode first -- otherwise unzooming would drop
# you back into tall instead of your actual layout.
bind z run-shell '~/.config/nvim/dotfiles/tmux/dim-zoom "#{pane_id}" z'
# One key out of EITHER zoom, so you never have to remember which one you are
# in. Binds into the prefix table only -- bare Escape, copy-mode Escape and the
# resize-table Escape are all untouched. It is a no-op when nothing is zoomed,
# which keeps "C-a then Escape to abort a mistyped prefix" as harmless as it is
# today; that abort reflex is the whole reason this key needs to stay inert.
bind Escape run-shell '~/.config/nvim/dotfiles/tmux/dim-zoom "#{pane_id}" reset'
# Bare Escape leaves either zoom too -- the ZOOMED / TALL pill is on screen, so
# Esc should dismiss it like it does RESIZE and copy mode. Only while a zoom is
# actually active; every other Escape goes straight through. vim/nvim/fzf keep
# their Escape even when zoomed (it is how you leave insert mode) -- there,
# prefix Escape or prefix z is still the way out.
bind -n Escape if-shell -F '#{||:#{window_zoomed_flag},#{@dimzoom}}' \
  "if-shell \"$is_vim\" 'send-keys Escape' 'run-shell \"~/.config/nvim/dotfiles/tmux/dim-zoom #{pane_id} reset\"'" \
  'send-keys Escape'

# Persistent pane-resize mode. Prefix-r enters; movement stays in this table
# until Escape, q, or Enter explicitly returns the client to normal keys.
bind r switch-client -T resize \; refresh-client -S
bind -T resize h resize-pane -L 1 \; switch-client -T resize
bind -T resize j resize-pane -D 1 \; switch-client -T resize
bind -T resize k resize-pane -U 1 \; switch-client -T resize
bind -T resize l resize-pane -R 1 \; switch-client -T resize
bind -T resize H resize-pane -L 5 \; switch-client -T resize
bind -T resize J resize-pane -D 5 \; switch-client -T resize
bind -T resize K resize-pane -U 5 \; switch-client -T resize
bind -T resize L resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root \; refresh-client -S
bind -T resize q switch-client -T root \; refresh-client -S
bind -T resize Enter switch-client -T root \; refresh-client -S

# Restore the Resurrect session on Prefix-R and show its confirmation banner.
# Mirrors Prefix-S (save). Resurrect's own default restore key is Prefix-Ctrl-r,
# now repurposed for config reload -- that binding lives in the post-plugin
# override block below, since the plugin binds C-r on load and only a bind after
# `run tpm` wins.
bind R \
  run-shell '~/.config/nvim/dotfiles/tmux/banner lime 0 "RESTORING SESSION…"' \; \
  run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh' \; \
  refresh-client \; \
  run-shell '~/.config/nvim/dotfiles/tmux/banner green 2000 "SESSION RESTORED"'

# ==========================================
# 2b. UI POLISH (tmux 3.5+ surfaces)
# HUE CARRIES MEANING. BRIGHTNESS CARRIES STATE.
#
# The accents are no longer fixed here -- four surfaces are generated by
# ~/.local/bin/tmux-color (tmux-bar / tmux-chip / tmux-pane / tmux-pane-lines),
# one colour in and two out: BRIGHT as given, DIM at 48%. Chasing a hex in this
# file is how the palette used to fall out of sync; read the managed blocks.
#
# What is FIXED, because it means something no colour picker may override:
#   #FF2E97 synth pink  MODE -- prefix-wait, copy mode, command prompt, menus
#   #FF8500 orange      BLAST RADIUS -- prod kube context, ssh/sudo pane pill.
#                       The brightest fully saturated value that still reads
#                       orange; #FF9100 crosses to hue 34 and reads amber.
#   #00FF33 pure green  DONE -- saved / reloaded (message-style, user's own)
#   #a0ffff pale ice    copy-mode selection + match (user's own)
#   #080808 void        knockout text on any lit slab
#
# The ON/OFF ratio is the active-pane indicator itself: tmux signals focus by
# LIGHTING a border, which is a brightness step, not a hue step. #00ffff once
# shipped as the INACTIVE colour, out-glowed the active orange, and inverted the
# signal -- the UI read as broken. Print both luminances before adding a pair.
#
# RETIRED, and drift if seen again: #2ff5ff / #22949f cyan, #ACFF00 acid lime,
# #FFA500 amber, #0d3238 slate.
# ==========================================

# --- Popups & menus -----------------------------------------------------
# Rounded corners on the weather / messages / pane-picker / keys popups.
set -g popup-border-lines rounded
# popup-border-style is generated -- see the tmux-bar-managed block
set -g popup-style        "bg=default"
set -g menu-border-lines  rounded
# menu-border-style is generated -- see the tmux-bar-managed block
set -g menu-style         "bg=default,fg=default"
# Default was a screaming bg=yellow,fg=black.
set -g menu-selected-style "bg=#FF2E97,fg=#080808,bold"

# --- Messages -----------------------------------------------------------
# Two-state banner scheme:
#   #93FF12 (acid lime)  = in flight -- working, prompting, searching
#   #00FF33 (pure green) = done -- saved / reloaded / succeeded
# Text is #000000, the darkest possible, for max contrast on both.
#
# fill= IS REQUIRED and must match bg. Without it tmux paints the bar only as
# wide as the message text, so short messages became stubs and animated ones
# (resurrect's spinner, the search prompt as you type) visibly changed width on
# every keystroke. tmux's own default carries it -- "bg=yellow,fg=black,
# fill=yellow" -- and overriding the style without fill is what dropped it.
# This covers every message and prompt globally; nothing needs manual padding.
set -g message-style         "bg=#00FF33,fg=#000000,bold,fill=#00FF33"
set -g message-command-style "bg=#FF2E97,fg=#080808,bold,fill=#FF2E97"

# NOTE: Ghostty's foreground is `#006609` (phosphor green); window-active-style
# must NAME that same colour so plain shell text inside tmux matches outside it.
# If Ghostty's foreground changes, change the active-style fg below to match.
#
# UNFOCUSED PANES ARE DIMMED, and this needs the FOREGROUND, not the
# background. An earlier attempt set only `window-style bg=#000000` and was
# invisible: tmux's window background paints cells nothing has claimed, and a
# shell or a TUI paints its own. Text is the thing you actually see, and most
# of it is drawn in the DEFAULT foreground -- so overriding that is what makes
# an unfocused pane recede.
#
# The pair is the same lit/unlit rule the borders obey: the active value is
# Ghostty's real foreground, the inactive one is that colour dimmed toward the
# background. window-active-style must NAME the colour rather than say
# `default`, or the active pane inherits the dim value from window-style.
#
# Known limit: an app that sets its own colours (nvim, lazygit, anything with a
# theme) is unaffected -- it is not asking for the default foreground. This
# dims shells, logs, plain output and man pages, which is most of what sits in
# a pane you are not looking at.
# Per-pane default foreground, keyed on the live process:
#   - Claude Code panes get their OWN fg, because Claude renders its chat body
#     in the terminal's DEFAULT foreground (not themeable -- confirmed), so the
#     only lever on "wall of green chat text" is this default fg, per pane.
#   - Everything else keeps the phosphor green.
# Claude reports its process name as a bare version number (e.g. 2.1.216), not
# "claude" -- so the match catches numerics too, exactly like @pane_icon does.
# Both branches keep a bright (active) + dim (inactive) variant, so the
# unfocused-pane dimming still works for Claude and for shells alike.
# The pane_current_command test is only a FALLBACK: while Claude runs a tool the
# foreground process is zsh/node/git, the regex stops matching, and the pane
# flips to the shell colour mid-answer (it lands on the next full redraw, i.e.
# when you switch panes and come back). So Claude's own SessionStart hook stamps
# a sticky per-pane flag @cc_pane (cleared on SessionEnd) and that wins.
# SessionEnd does not fire on a crash or kill -9, so zsh's precmd clears the
# flag too -- that only runs once control is genuinely back at the prompt, so
# it cannot fight a live Claude session.
set -g @is_claude "#{?@cc_pane,1,#{m/ri:^(claude|claude-code|[0-9]+\\.[0-9.]+)$,#{pane_current_command}}}"
set -g window-active-style "#{?#{E:@is_claude},fg=#00ffc8,fg=#00ffc8}"
set -g window-style        "#{?#{E:@is_claude},fg=#008c6e,fg=#008c6e}"

# --- Pane borders -------------------------------------------------------
# NB: pane-border-lines takes single|double|heavy|simple|number|spaces only --
# "rounded" is valid for popup/menu borders but NOT here.
set -g pane-border-lines      single
#
# 'colour', no arrows. RING SEMANTICS, per Jimmy's rule: every line TOUCHING
# a pane shows that pane's state -- at CELL granularity on vertical dividers.
# The colour indicator draws exactly the divider cells adjacent to the active
# pane in the ACTIVE style, which is the only per-cell mechanism tmux has: a
# flag lights an owner's whole divider, and a full-height divider then glowed
# beside panes the active pane never touches ("the entire left pane line is
# lit", 2026-07-22). So: active columns = native indicator; title rows = row
# flags via the pane-border-format fill (the indicator's blind spot); copy
# tint = col flags in both styles. See the override block below the
# tmux-pane-lines managed block.
set -g pane-border-indicators colour
#
# THE RULE THESE TWO MUST OBEY: tmux signals the active pane by lighting a
# border, so the pair has to read as UNLIT vs LIT -- a brightness step. Hue
# contrast alone does NOT work. Verified by probe: with exactly two panes tmux
# splits the single shared divider, drawing the half nearest the active pane in
# pane-active-border-style and the rest in pane-border-style. If both colours
# are equally bright the split reads as two competing lines, not as one line
# half-lit, and the indicator is destroyed. #00ffff as the INACTIVE colour did
# exactly that -- it out-glowed the active orange and inverted the signal.
#
# So: inactive is the SAME cyan hue as ACTIVE_INDENT_SCOPE in nvim's theme.lua
# (keeping a tmux divider and an nvim scope guide visually related) but dimmed
# hard, so it reads as the glow line at rest. Active is bright orange, which is
# unambiguously the brighter of the two.
#
# NB: the arrow marker has NO colour option of its own -- it is drawn from
# pane-active-border-style, the same option as the lit half. A cyan divider
# with an orange arrow is therefore NOT expressible in tmux. Don't retry it.
# ON / OFF pair. Same hue, brightness carries the state (see the rule above).
# Both values are generated at DIM_SCALE = 0.48, which is the ratio the
# hand-tuned pairs used before the generator existed:
#   #FF8500 / #7a4000   L 0.380 / 0.078   4.9x
#   #03FC45 / #017a22   L 0.701 / 0.140   5.0x
# Target the 4-6x band. Do not raise OFF past ~L=0.30 or the lit/unlit read
# collapses and the active-pane indicator stops working.
# >>> tmux-pane-lines-managed >>>  DO NOT EDIT BY HAND -- rewritten by `tmux-pane-lines`
# bright = #66fff2   active / values / dividers
# dim    = #307a74   labels / inactive / unlit
set -g pane-border-style        "fg=#307a74"
set -g pane-active-border-style "fg=#66fff2"
set -g @pane_lines_bright "#66fff2"
set -g @pane_lines_dim "#307a74"
# <<< tmux-pane-lines-managed <<<

# Copy-mode border tint, PER PANE. A pane that is in copy mode gets its border
# in the copy accent -- that pane, not the active pane. Enter copy mode in two
# panes and both light; switch away from a copy-mode pane and its tint STAYS
# with it. (The previous design used a window-level @copy_active flag keyed to
# the active pane; the tint followed focus around the window, which read as
# "copy mode travels with the cursor" -- wrong, and reported as a bug.)
#
# The mechanism is owner-pane context, the very thing that used to be the
# trap: tmux evaluates border styles against the border's OWNER pane, so
# #{pane_in_mode} here is per-pane truth for free -- no hook, no flag. On a
# shared divider the owner is one of the two panes it touches; the tint lands
# when that owner is in copy mode, which is the closest per-pane semantics a
# one-cell shared line can express.
#
# These overrides MUST sit below the managed block: `tmux-pane-lines` rewrites
# the plain style lines above, and being later in the file these win (last set
# applies). Colours come from @pane_lines_bright/@pane_lines_dim, exported by
# `tmux-pane-lines` itself, so recolouring the dividers still moves both.
#
# REACTIVE CHROME on the active border: prefix-pending outranks copy mode.
# While the prefix is armed, the active pane's border takes THE WAIT CHIP'S
# OWN COLOUR (@prefix_highlight_bg) -- chip and border are one signal, per
# Jimmy's rule. @prefix_active, NOT client_prefix: borders draw with no
# client context, so #{client_prefix} silently evaluates false here.
# mode-dots-loop publishes the flag on prefix transitions and forces the full
# refresh that makes borders repaint at all.
# RING SEMANTICS (Jimmy's rule): every line TOUCHING a pane shows that pane's
# state -- and ONLY those lines:
#   copy ring   -> @copy_mode_color  around a copy-mode pane; stays put when
#                                    focus leaves; plural panes each keep
#                                    their own ring
#   active ring -> chip cyan while the prefix is armed, else bright
#   otherwise   -> dim
# The flags are PER SEGMENT, stamped by the copy-ring script (hooks below).
# A pane owns two different border segments -- its TITLE ROW (horizontal
# lines belong to the pane BELOW, being its title) and its RIGHT DIVIDER
# (vertical lines belong to the pane on the LEFT) -- and they touch different
# neighbours. One per-pane flag lit both together ("all the lines light up",
# reported 2026-07-22), so: @active_row/@copy_row light the title row, drawn
# by pane-border-format, which paints its own line fill in the generated
# tmux-pane block; @active_col/@copy_col light the vertical dividers, which
# after that fill are the only cells these styles still colour. Both styles
# are IDENTICAL so whichever one tmux picks per cell is irrelevant. Copy
# wins where the rings overlap.
# Division of labour (the styles are NOT identical any more, on purpose):
#   - ACTIVE column cells, PARTIAL case: tmux's colour indicator applies the
#     ACTIVE style to exactly the divider cells adjacent to the active pane --
#     per-cell truth no flag can express. This alone is correct for asymmetric
#     layouts (2x2 grids etc.) where only part of a column abuts the active pane.
#   - ACTIVE column cells, WHOLE-DIVIDER case: with exactly two panes tmux
#     SPLITS the shared divider and lights only the half nearest the active pane
#     (probe-verified, ~L519), leaving the far half dim. @active_col fixes that:
#     copy-ring sets it only when the WHOLE divider abuts the active pane (an
#     active neighbour fully spans it, or it is the active pane's own divider),
#     and pane-border-style lights the far half bright. Partial overlaps leave
#     @active_col unset and defer to the native indicator, so no over-lighting.
#   - COPY tint, active case: when the ACTIVE pane is the one in copy mode
#     (the common case), those same native active-adjacent cells go lime via
#     @copy_active_w -- a WINDOW flag copy-ring restamps on mode AND focus
#     changes, so it cannot go stale the way the old @copy_active did. This
#     is the per-cell copy ring.
#   - COPY tint, switched-away case: @copy_col in both styles -- flag
#     granularity (whole owner divider), the only mechanism left for a
#     non-active pane; copy-ring excludes active copy panes from col flags
#     so the two cases never double-light.
#   - TITLE ROWS: painted by pane-border-format's own fill from the row
#     flags (generated tmux-pane block); these styles never touch them.
set -g @prefix_active 0
# The #{?pane_marked,reverse#,,} prefix on both styles is the marked-square
# fix. tmux HARDCODES an attr ^= REVERSE (an XOR, no option controls it) on
# every border cell of the marked pane -- that reverse floods the cell's
# background with the border colour, which is the "bright square" left of the
# pill. Pre-setting reverse in the style ONLY when the pane is marked makes
# tmux's XOR cancel it. Format-drawn cells inherit the base attr without the
# XOR, so pane-border-format starts with #[noreverse] to shed it (a no-op
# whenever nothing is marked). Measured on nested throwaway servers 2026-08-13;
# the earlier "tmux drops #[dim] on the cap" theory was wrong -- dim survives.
# Known residual: a divider cell abutting a marked ACTIVE pane still floods
# (that cell's style evaluates in the unmarked neighbour's context, so the
# prefix cannot fire) -- same as before this fix, and marked+active is rare.
set -g pane-active-border-style "#{?pane_marked,reverse#,,}#{?#{||:#{@copy_col},#{@copy_active_w}},fg=#{@copy_mode_color},#{?#{@prefix_active},fg=#{@prefix_highlight_bg},fg=#{@pane_lines_bright}}}"
set -g pane-border-style        "#{?pane_marked,reverse#,,}#{?#{@copy_col},fg=#{@copy_mode_color},#{?#{@active_col},#{?#{@prefix_active},fg=#{@prefix_highlight_bg},fg=#{@pane_lines_bright}},fg=#{@pane_lines_dim}}}"

# Keep the rings current: mode enter/exit, focus moves, and layout changes
# re-stamp every pane; config load initialises them. Hooks set without -a so
# re-sourcing replaces rather than stacks.
run-shell -b '~/.config/nvim/dotfiles/tmux/copy-ring'
set-hook -g pane-mode-changed      'run-shell -b "~/.config/nvim/dotfiles/tmux/copy-ring"'
set-hook -g window-layout-changed  'run-shell -b "~/.config/nvim/dotfiles/tmux/copy-ring"'
set-hook -g window-pane-changed    'run-shell -b "~/.config/nvim/dotfiles/tmux/copy-ring"'
# A white-hot pulse on the destination ring. Its 550ms dwell begins after the
# full border repaint, so the shader pipeline cannot swallow the visible frame.
# composes with copy-ring and re-sourcing remains idempotent.
set-hook -g window-pane-changed[1] 'run-shell -b "~/.config/nvim/dotfiles/tmux/focus-pulse"'

# >>> tmux-pane-managed >>>  DO NOT EDIT BY HAND -- rewritten by `tmux-pane`
# bright = #66fff2   active / values / dividers
# dim    = #307a74   labels / inactive / unlit
set -g pane-border-format "#[noreverse]#{?#{||:#{pane_dead},#{m/r:^(ssh|mosh|sudo|doas|su)$,#{pane_current_command}}},#{?pane_active,#[fg=#FF8500],#[fg=#7a4000]},#{?pane_active,#{?pane_in_mode,#[fg=#{@copy_mode_color}],#[fg=#66fff2]},#[fg=#307a74]}}#{?pane_zoomed_flag,#[dim]#[nodim],#[dim]#[nodim]}#{?#{||:#{pane_dead},#{m/r:^(ssh|mosh|sudo|doas|su)$,#{pane_current_command}}},#{?pane_active,#[fg=#080808#,bg=#FF8500#,bold],#[fg=#080808#,bg=#7a4000#,bold]},#{?pane_active,#{?pane_in_mode,#[fg=#080808#,bg=#{@copy_mode_color}#,bold],#[fg=#080808#,bg=#66fff2#,bold]},#[fg=#080808#,bg=#307a74#,bold]}} #{pane_index}#{?pane_marked,  ,}#{?pane_active,,#{?#{&&:#{pane_last},#{>:#{window_panes},1}},  ,}} #{?#{||:#{pane_dead},#{m/r:^(ssh|mosh|sudo|doas|su)$,#{pane_current_command}}},#{?pane_active,#[fg=#FF8500#,bg=default],#[fg=#7a4000#,bg=default]},#{?pane_active,#{?pane_in_mode,#[fg=#{@copy_mode_color}#,bg=default],#[fg=#66fff2#,bg=default]},#[fg=#307a74#,bg=default]}}#[dim]#[nodim]#{?#{||:#{pane_dead},#{m/r:^(ssh|mosh|sudo|doas|su)$,#{pane_current_command}}},#{?pane_active,#[fg=#FF8500#,bg=default#,bold],#[fg=#7a4000#,bg=default#,bold]},#{?pane_active,#{?pane_in_mode,#[fg=#{@copy_mode_color}#,bg=default#,bold],#[fg=#66fff2#,bg=default#,bold]},#[fg=#307a74#,bg=default#,bold]}} #{?#{E:@pane_icon},#{E:@pane_icon} ,}#{?pane_dead, exit #{pane_dead_status},#{?#{m/r:^(ssh|mosh|sudo|doas|su)$,#{pane_current_command}},󰢹 ,}#{?#{E:@pane_name},#{E:@pane_name},#{?#{||:#{==:#{pane_title},#{host}},#{||:#{==:#{pane_title},},#{m/r:^:?/,#{pane_title}}}},#{=/40:#{s|^~/([^/]+)/.*/([^/]+)$|\\1/…/\\2|:#{s|^/Users/jimmy|~|:pane_current_path}}},#{s/^[^0-9A-Za-z] //:pane_title}}}} #[bg=default#,nobold]#{?#{@copy_row},#[fg=#{@copy_mode_color}],#{?#{@active_row},#{?#{@prefix_active},#[fg=#{@prefix_highlight_bg}],#[fg=#{@pane_lines_bright}]},#[fg=#{@pane_lines_dim}]}}#{R:─,#{pane_width}}#[default]"
set -g display-panes-colour        "#307a74"
set -g display-panes-active-colour "#66fff2"
set -g clock-mode-colour           "#66fff2"
# <<< tmux-pane-managed <<<

# Two blocks, two commands, on purpose: `tmux-pane-lines <color>` owns the
# rules (borders + scrollbar), `tmux-pane <color>` owns the titles (the pill,
# pane numbers, the clock). Set them to the same colour for one surface, or
# different ones for a lit pill on a quiet divider. Notes on each kept below.

# Pane titles in the top border.
set -g pane-border-status top

# BRACKETED ACTIVE TITLE -- the real active-pane indicator.
#
# tmux's built-in arrow is drawn from pane-active-border-style and so can never
# be a different colour from the bar. pane-border-format CAN take its own
# #[fg=] escapes plus #{?pane_active,,} conditionals, so the brackets are
# orange while the bar stays icy, and they appear on the ACTIVE PANE ONLY.
#
# GOTCHA: a comma inside #[...] must be escaped as "#," or tmux reads it as the
# separator of the enclosing #{?...} conditional. Hence "#[fg=#FF8500#,bold]".
# The templates avoid this entirely by writing each style as its own #[..]
# block -- no commas, nothing to escape. Only pane-border-format still needs
# the escapes, because its slab styles genuinely are comma-joined.
#
# Trailing #{?#{mouse},...} is tmux's stock clickable [z] zoom / [x] kill
# buttons, kept as-is.
#
# Swap the bracket pair freely -- ⟪⟫  ⟨⟩  «»  [ ]  ❰❱  ⌜⌟

# Faint dot grid in the unused region of a pane.
# prefix+q pane numbers and the clock were still on tmux's stock blue/red.

set -g fill-character '·'

# --- Scrollbars (3.5+) --------------------------------------------------
# modal = scrollbar appears only in copy mode, so normal panes stay clean.
# ('on' for always-visible, 'off' to disable.)
set -g pane-scrollbars modal
set -g pane-scrollbars-position right

# --- Copy-mode tint -----------------------------------------------------
# THE one place to edit the copy-mode accent. While the ACTIVE pane is in copy
# mode, its border AND its Reactor Tag title pill switch from the orange bright
# to this colour -- the same acid lime as the COPY chip in the status bar
# (@prefix_highlight_copy_prompt below reads this too), so "I am scrolling /
# reading" is signalled in one hue across the whole pane.
#
# It is a LIVE option, read at every render: set it and the change lands the
# instant you next enter copy mode -- no reload, no regenerate. Two ways in:
#   tmux set -g @copy_mode_color '#RRGGBB'     (this session only, to preview)
#   tmux-copy <name|#hex>                      (sets live AND rewrites the block)
# The pill half of this lives in the generated tmux-pane block above and reads
# #{@copy_mode_color} the same way; the border half is overridden just below the
# tmux-pane-lines block. Neither bakes the hex.
#
# The SCROLLBAR is why this is a generated block and not one hand-edited line.
# pane-scrollbars-style is a style, not a format: it cannot reference the option
# above and has to bake the hex twice (thumb + trough). It used to sit in the
# tmux-pane-lines block, where its trough tracked the PANE palette while its
# thumb was pinned to lime -- two accents on one widget. `tmux-copy` writes all
# three from a single colour so they cannot drift.
# >>> tmux-copy-managed >>>  DO NOT EDIT BY HAND -- rewritten by `tmux-copy`
# bright = #be73ff   active / values / dividers
# dim    = #5b377a   labels / inactive / unlit
set -g @copy_mode_color '#be73ff'
set -g pane-scrollbars-style "bg=#261733,fg=#be73ff,width=1,pad=0"
setw -g mode-style "bg=#be73ff,fg=#080808"
set -g copy-mode-match-style         "bg=#261733,fg=#be73ff,bold"
set -g copy-mode-current-match-style "bg=#be73ff,fg=#080808,bold"
# <<< tmux-copy-managed <<<

# --- Copy-mode search ---------------------------------------------------
# Both match styles are generated now -- see the tmux-copy-managed block. They
# were stock-replacing hand-sets (pale cyan matches, amber current match) and
# were the last things in copy mode not tracking `tmux-copy`.
# copy-mode-mark-style is generated -- see the tmux-bar-managed block

# ==========================================
# 3. TMUX PLUGIN MANAGER (TPM) & PLUGINS
# ==========================================

# Declare targeted Git repositories for plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'fcsonline/tmux-thumbs'
# continuum is declared LAST as required by its README: it drives autosave by
# appending a `#{continuum_status}` interpolation to status-right, so a plugin
# loading after it can overwrite status-right and kill autosave silently.
#
# 🚨 BUT THAT IS NOT THE USUAL CAUSE. The real one, found 2026-08-10:
# continuum.tmux `main()` calls add_resurrect_save_interpolation ONLY when
# `! another_tmux_server_running`. **If ANY second tmux server exists at the
# moment this config is sourced, continuum skips the injection entirely and
# autosave is dead until the next reload with no other server running.** No
# error, no warning -- `prefix S` still works, so it looks fine.
#
# That is a real hazard here because scratch servers (`tmux -L vfy -f tmux.conf`,
# the sanctioned way to test edits without touching the live server) count, and
# so does any test server another session forgot to kill. One was found idle for
# hours, which is exactly what froze @continuum-save-last-timestamp while manual
# saves kept appearing and made autosave look healthy.
#
# Audit:  tmux show-options -gv status-right | grep -c continuum_status   # want 1
# If 0:   kill stray servers, THEN reload. Order matters -- reloading first does
#         nothing. `~/.config/scripts/tmux-cap-guard.sh` now checks this for you.
set -g @plugin 'tmux-plugins/tmux-continuum'

# extrakto: Prefix-Tab fuzzy-picks any token on screen (paths, URLs, hashes)
# straight into the buffer. Uses the fzf + python3 already on this machine.
set -g @extrakto_key 'Tab'
set -g @extrakto_split_direction 'p'          # render into a popup, not a split
set -g @extrakto_popup_size '65%'
set -g @extrakto_clip_tool 'pbcopy'
set -g @extrakto_fzf_tool '/opt/homebrew/bin/fzf'

# tmux-thumbs: vimium-style hint labels over everything on screen -- paths,
# hashes, URLs, IPs, line numbers -- press the letter, it's on the clipboard.
# Complements extrakto rather than duplicating it: extrakto is a fuzzy LIST you
# type into, thumbs is an in-place AIM. Nothing is drawn until you ask.
#
# @thumbs-command MUST pipe to pbcopy. The default copies via tmux's buffer,
# which is OSC52 in a float and therefore dead there -- the same rule the
# copy-mode keys follow.
# NB: F is already taken -- floax-size full. y is free and is the right
# mnemonic anyway: this is a yank.
set -g @thumbs-key y
set -g @thumbs-alphabet qwerty-homerow
set -g @thumbs-reverse enabled               # shortest hints nearest the cursor
set -g @thumbs-unique enabled                # one hint per distinct string
set -g @thumbs-position off_left
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'echo -n {} | pbcopy && tmux paste-buffer'
# The hint letter must not share a colour with the text it sits against, or the
# two read as one blob. So: matched text stays teal and RECEDES, the hint is a
# purple slab in a hue nothing else here uses. @thumbs-contrast also wraps the
# hint in [brackets], so it stays findable without relying on colour at all.
set -g @thumbs-contrast 1
set -g @thumbs-bg-color '#101010'
set -g @thumbs-fg-color '#00a884'
set -g @thumbs-hint-bg-color '#be73ff'
set -g @thumbs-hint-fg-color '#000000'
set -g @thumbs-select-fg-color '#000000'
set -g @thumbs-select-bg-color '#ffd166'

# tmux-floax: toggleable floating scratch pane.
# Kept on 'o' rather than its default 'p'. The original reason was a collision
# with pomodoro, now removed, so 'p' is free again -- but 'o' is in the fingers.
# It only shadows the built-in select-pane -t :.+, which h/j/k/l already covers.
# NB: floax also binds 'P' for its menu (@floax-bind-menu), unconditionally.
set -g @floax-bind 'o'
# floax's float lives in its own session. Its default name is 'scratch', which
# collides with the session `bind T` creates -- P's menu then treats real work
# windows as the float and moves them into it.
set -g @floax-session-name 'floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
# @floax-border-color is generated -- see the tmux-float-managed block below.
# It moved OUT of the tmux-bar block: on the bar's dim it was the same hex as an
# unlit pane border, so the float read as a pane. `tmux-float <colour>`.
set -g @floax-text-color 'default'
# Off: floax `send-keys`es a literal `cd "<path>"` + Enter into the float to sync
# its cwd to the calling pane. That assumes a shell sitting at a prompt in there.
# When the float holds Claude (or any TUI), those keystrokes land in its input
# box and get submitted -- and since the pane's cwd never actually changes, the
# mismatch check stays true and it re-fires on EVERY prefix o. Sends live in
# floax scripts/utils.sh, guarded by this option.
set -g @floax-change-path 'false'

# >>> tmux-float-managed >>>  DO NOT EDIT BY HAND -- rewritten by `tmux-float`
# bright = #ff9b69   active / values / dividers
# dim    = #7a4a32   labels / inactive / unlit
set -g @floax-border-color '#ff9b69'
# <<< tmux-float-managed <<<

# 3. Enable automatic environment restoration on startup
set -g @continuum-restore 'on'

# 4. AUTOSAVE IS NOT CONTINUUM'S ANYMORE (2026-08-11).
# continuum only arms autosave when NO other tmux server exists at source time
# (continuum.tmux main(): `if ! another_tmux_server_running`). Testing tmux edits
# on a throwaway socket is the sanctioned workflow here, and concurrent sessions
# leave scratch servers up for hours -- so autosave was dead for 8+ hours across
# two different strays, silently, while `prefix S` kept working and made it look
# fine. Setting the interval to 0 disables continuum's trigger outright so the
# two cannot both fire; ~/.config/scripts/tmux-autosave.sh replaces it below.
# continuum stays installed and still owns RESTORE (@continuum-restore above).
set -g @continuum-save-interval '0'
# The replacement trigger: same idea (a #() the status line evaluates every
# status-interval), minus the server check, and hard-pinned to the `default`
# socket so a scratch server can neither trigger a save nor overwrite the real
# one -- a stronger guarantee than "no other server exists". Emits no text, so
# status-right's width is unchanged.
set -ga status-right "#(~/.config/scripts/tmux-autosave.sh)"

# GHOST-BORDER CLEANUP (dots after restore). Continuum auto-restores the SAVED
# layout string, while `window-size latest` sets the window to the ACTUAL client
# size. On a laptop/external-monitor swap those disagree -- window 265x66 still
# holding a layout of 190x51 -- and tmux paints the window area OUTSIDE the panes
# with the pane-border pattern. That is the dotted orange field on the right and
# bottom. It never self-corrects: tmux only rescales a layout when the window
# size CHANGES, and after a restore it never changes again.
#
# The old fix here was `refresh-client`, which could not work -- redrawing a
# stale layout just redraws it. Verified 2026-07-28: refresh-client,
# `resize-window -A` (no-op, the window is already the right size) and
# `select-layout` (re-reads the same stale string) are ALL no-ops. Only an actual
# size change forces the recompute, which is what relayout-stale does.
#
# ONE trigger, deliberately: resurrect's post-restore hook, the single moment the
# desync is created. Do NOT add `client-resized` -- `resize-window` emits that
# event, so the hook would re-trigger itself forever. That mistake pinned the GPU
# at 76% and cooked the machine once already. relayout-stale is also guarded to
# skip windows already in sync, so a stray re-fire does no work.
#
# Three triggers, all chosen because relayout-stale CANNOT cause them:
# resurrect post-restore (case A is created there), client-attached (picks up a
# resolution change made while detached), and after-select-window (makes it live
# -- any window you switch to is corrected as you land on it). `client-resized`
# would be the obvious fourth and is BANNED: resize-window emits it, so the hook
# would re-trigger itself forever. That pinned the GPU at 76% once already.
# The marker write is autosave's arming signal: tmux-autosave.sh refuses to
# save until a restore has run on THIS server (or the server is 30+ min old),
# because the 2026-08-12 reboot proved a time-only grace period is not enough --
# a save that fires after the grace but before restore/rebuild still clobbers
# `last` with a near-empty layout.
set -g @resurrect-hook-post-restore-all 'tmux run-shell -b "date +%s > ~/.local/state/tmux-restored-at; ~/.config/nvim/dotfiles/tmux/relayout-stale; sleep 4; tmux list-sessions -F \"##{session_id}\" | while read -r s; do tmux kill-session -C -t \"\$s\"; done"'
# The tail of that hook wipes the activity dots a restore leaves behind: every
# restored shell prints a prompt, tmux counts that as unseen output, and the
# whole rail came up lit on every boot. `kill-session -C` kills nothing -- it
# only clears alerts -- and the 4s wait lets the shells and relayout-stale's
# resize redraws finish first, so only output after that lights a dot.
# Resurrect never prunes its own saves -- 2330 of them had piled up back to
# 07-10 by 2026-08-10. Disk is a non-issue; the problem is that during a real
# recovery you cannot tell which save is the good one. save.sh runs
# post-save-all at the end of EVERY save, and continuum shells out to that same
# save.sh, so this one hook covers autosave and `prefix S` alike.
# Keeps the 10 newest, plus whatever `last` points at, always.  KEEP=n to change.
set -g @resurrect-hook-post-save-all 'tmux run-shell -b "~/.config/scripts/tmux-resurrect-prune.sh"'
# -gu then -ga, never a bare -g. A plain `set-hook -g client-attached` REPLACES
# the whole array, so this file's THREE client-attached entries (here, the
# relayout-stale one below, and chip-flicker further down) used to depend purely
# on line order: this one had to stay first and the other two had to be -a. Any
# future edit inserting a bare -g between them would silently delete whichever
# entries came before it, with no error -- the same silent-revert class as the
# pill-cap regression. `-gu` unsets the array, then every entry appends, so the
# set is now order-independent and re-sourcing the config cannot stack them.
# NOT FOR THE FLOAT (2026-10-11). prefix-o opens a popup running a second client
# attached to the `floax` session, so every client-attached / client-resized
# hook fired on each float open: a refresh, relayout-stale resizing the float's
# window to the popup client's size and back, and six chip-flicker frames, each
# a set-option. A popup repaints the WHOLE screen per change, so that was a
# ~1s repaint storm (measured: ~650 sync toggles) with the cursor exposed
# mid-draw all over the float -- the flicker, and the cursor-trail comets from
# every direction. The `if -F` guard on all four hooks skips the float's client.
set-hook -gu client-attached
set-hook -ga client-attached 'if -F "#{!=:#{session_name},floax}" "run-shell -b \"sleep 0.3; tmux refresh-client\""'
# sleep 0.5: when client-attached fires the terminal has not yet reported its
# real size, so the script compares against the STALE client size and no-ops.
# Verified 2026-07-28: without the delay, dots on every re-attach.
set-hook -ga client-attached 'if -F "#{!=:#{session_name},floax}" "run-shell -b \"sleep 0.5; ~/.config/nvim/dotfiles/tmux/relayout-stale\""'
# Deliberately NOT on after-select-window. That fires on every window switch --
# a hot path -- to catch a condition that only arises when the CLIENT resizes,
# which the hook below now handles at the source.
#
# LIVE RESIZES (Cmd +/- font size, window drag, fullscreen). These are the common
# case and attach-time cleanup never sees them, so they left dots until the next
# re-attach. Hooked here via relayout-ONRESIZE, never relayout-stale directly:
# `resize-window` emits `client-resized`, so the bare script on this hook is a
# hook that fires itself -- the thing that pinned the GPU at 76% and cooked the
# machine once. The wrapper holds an atomic mkdir lock across the debounce, the
# relayout, AND a cooldown that outlasts its own echoed events, so the re-entrant
# fires are dropped instead of doing work. Read the header of relayout-onresize
# before touching either side of this.
# Plain -g, NOT -ga: this file gets re-sourced, and `-ga` appends a duplicate
# every single time, so two sources = the wrapper racing itself on every resize.
# Measured 2026-07-28: one re-source, two entries. Nothing else uses
# client-resized (verified empty), so replacing index 0 is safe and idempotent.
set-hook -g client-resized 'if -F "#{!=:#{session_name},floax}" "run-shell -b ~/.config/nvim/dotfiles/tmux/relayout-onresize"'
# If dots ever survive anyway, run the inner script by hand:
#   ~/.config/nvim/dotfiles/tmux/relayout-stale
# Appended (-a), not set: a plain `set-hook -g client-attached` REPLACES the
# whole hook array, so this has to come after the one above and append rather
# than clobber it. Fires the window-chip flicker once on attach too.
set-hook -ga client-attached 'if -F "#{!=:#{session_name},floax}" "run-shell -b ~/.config/nvim/dotfiles/tmux/chip-flicker"'

# Prefix highlight styling
set -g @prefix_highlight_fg '#080808'
set -g @prefix_highlight_bg '#00ffe1'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#080808,bg=#00ffe1,bold'
set -g @prefix_highlight_dots ''
set -g @prefix_highlight_prefix_prompt '#[fg=#00ffe1]#[bg=default]#[dim]#[nodim]#[fg=#080808]#[bg=#00ffe1]#[bold] WAIT#{@prefix_highlight_dots} #[fg=#00ffe1]#[bg=default]#[nobold]#[dim]#[nodim]'
# The COPY chip reads @copy_mode_color (the copy-mode tint block) so the
# status-bar chip and the in-pane border+pill are one editable colour.
set -g @prefix_highlight_copy_prompt '#[fg=#{@copy_mode_color}]#[bg=default]#[dim]#[nodim]#[fg=#080808]#[bg=#{@copy_mode_color}]#[bold] COPY#{@prefix_highlight_dots} #[fg=#{@copy_mode_color}]#[bg=default]#[nobold]#[dim]#[nodim]'
set -g @prefix_highlight_sync_prompt '#[fg=#00ffe1]#[bg=default]#[dim]#[nodim]#[fg=#080808]#[bg=#00ffe1]#[bold] SYNC#{@prefix_highlight_dots} #[fg=#00ffe1]#[bg=default]#[nobold]#[dim]#[nodim]'
set -g @prefix_highlight_output_prefix '#[default]'
set -g @prefix_highlight_output_suffix '#[default]'

# CRITICAL: tpm reads every configuration written above it and applies the
# plugin logic, so all @plugin and @option lines must precede it. The only
# thing that may follow is the override block below -- a plugin binding can be
# undone only after the plugin has installed it.

run-shell -b 'sh "$HOME/.config/nvim/dotfiles/tmux/mode-dots-loop"'

run '~/.tmux/plugins/tpm/tpm'

# --- Post-plugin overrides ----------------------------------------------
# Drop floax's menu (@floax-bind-menu, hardcoded to P -- no option disables
# it). Every item on that menu -- size up/down, full screen, reset, embed --
# is already a C-M-* key that floax binds while the float is open, which is
# the only time those actions apply. From outside the float the menu offers
# just "pop current window", which moves the current window into the floax
# session and destroys its origin session if it was the last window there.
# That is how the DevOps session was lost on 2026-07-19. Prefix-o, the actual
# toggle, is untouched.
unbind P

# --- FLOAT GUARD ---------------------------------------------------------
# The float is NOT an overlay. floax runs a second client attached to the
# `floax` session and sizes it to 80%x80%, which only LOOKS like a popup over
# your work. So any switch-client issued from inside it repoints THAT client:
# your real session gets rendered inside the float frame, status bar and all,
# with two clients now attached to it and the dotted layout-mismatch field
# painted around the edge. Observed 2026-07-29 via prefix g -> devops.
#
# Nothing is lost when that happens -- it is not the `P` menu's move-window,
# which is the one that destroyed the DevOps session on 2026-07-19 (unbound
# above). It is just a confusing nested view you then have to unpick.
#
# So every session switcher is gated on being outside the float: prefix g
# (sesh, up in section 2), prefix w (choose-tree, same), Cmd+Shift+; (User3,
# same), and the three built-ins below. Guarding the KEYS rather than hooking
# client-session-changed is deliberate: that hook fires on the very switch a
# fix-up would perform, which is a self-triggering hook -- see the standing
# rule against those.
#
# The guarded branch refuses and says so rather than auto-toggling out of the
# float first. Toggle-then-switch was the other option; it is untested and a
# refusal cannot surprise you.
#
# Pane and window navigation inside the float is untouched -- only switching
# SESSIONS is the problem, and the floax session has just the one window.
bind s if-shell -F '#{==:#{session_name},floax}' \
  'run-shell "~/.config/nvim/dotfiles/tmux/banner red 2500 \"IN THE FLOAT  ·  prefix o to exit, then switch\""' \
  'choose-session -Z'
bind ( if-shell -F '#{==:#{session_name},floax}' \
  'run-shell "~/.config/nvim/dotfiles/tmux/banner red 2500 \"IN THE FLOAT  ·  prefix o to exit, then switch\""' \
  'switch-client -p'
bind ) if-shell -F '#{==:#{session_name},floax}' \
  'run-shell "~/.config/nvim/dotfiles/tmux/banner red 2500 \"IN THE FLOAT  ·  prefix o to exit, then switch\""' \
  'switch-client -n'
# --- end FLOAT GUARD -----------------------------------------------------

# Prefix o / prefix C-o both toggle the float, through the guarded wrapper
# rather than floax.sh directly: floax.sh detaches the client whenever the
# current session is `floax`, which logs you clean out of tmux when your real
# client is the one parked on that session (the "fullscreen float"). The
# wrapper only detaches when a popup actually exists, and otherwise switches
# back to the session you came from. See the script for the full write-up.
#
# C-o exists so the scratch still opens when Ctrl is never released after the
# C-a prefix. Both binds have to live after `run tpm`, since the plugin defines
# prefix o itself on load and would otherwise win.
bind o   run-shell /Users/jimmy/.config/nvim/dotfiles/tmux/floax-toggle
bind C-o run-shell /Users/jimmy/.config/nvim/dotfiles/tmux/floax-toggle

# Prefix F -- FULL SCREEN the float, prefix M-f -- back to 80%.
#
# The plugin ships this behind its size menu on `@floax-bind-menu` (default
# prefix P), but that bind does not exist on this server: `tmux list-keys |
# grep menu.sh` returns nothing, so the only documented route to full screen was
# unreachable. The popup title bar advertises `C-M-f` for it, which is likewise
# bound to nothing here (C-M-f is next-matching-bracket in copy-mode).
#
# Routed through floax-size, NOT zoom-options.sh directly: the plugin script
# ends in a bare `tmux detach-client`, which logs you out of tmux when pressed
# from your real client instead of from inside the popup. The wrapper only hands
# off when a popup is actually up. See the script.
# The float's TITLE BAR is the tip row you see across the top of the popup. It
# is not a plugin option -- the plugin reads the global env var FLOAX_TITLE and
# only falls back to its own default when that is empty, so setting it here
# owns it permanently.
#
# The stock title advertised `C-M-s / C-M-b / C-M-f / C-M-r / C-M-e / C-M-d`
# with no hint that those are Ctrl-Alt chords rather than prefix keys, and no
# hint that they are `bind -n` ROOT binds the plugin installs on open and
# removes on close -- so they exist ONLY while the float is up, and pressing
# them anywhere else does nothing at all. Spell the modifier out.
set-environment -g FLOAX_TITLE " FLOAT  ·  ⌃⌥s smaller  ·  ⌃⌥b bigger  ·  ⌃⌥f full  ·  ⌃⌥r reset  ·  prefix o close "

bind F   run-shell "$HOME/.config/nvim/dotfiles/tmux/floax-size full"
bind M-f run-shell "$HOME/.config/nvim/dotfiles/tmux/floax-size reset"

# The plugin's own size menu, since its bind never landed. Guarded the same way
# as the other float keys -- its resize entries carry the same detach-client.
bind P   if-shell -F "#{==:#{session_name},floax}" \
  "run-shell \"$HOME/.tmux/plugins/tmux-floax/scripts/menu.sh\"" \
  "run-shell \"$HOME/.config/nvim/dotfiles/tmux/banner red 2500 \\\"SIZE MENU  ·  open the float first (prefix o)\\\"\""

# Prefix-Ctrl-r reloads this config. Resurrect binds C-r to its restore on load,
# so this override has to sit after `run tpm` to win; restore itself moved to
# Prefix-R (see the resurrect-restore bind up in section 2). Two-stage banner:
# acid lime while sourcing, pure green once it lands.
bind C-r \
  run-shell '~/.config/nvim/dotfiles/tmux/banner lime 0 "RELOADING CONFIG…"' \; \
  source-file ~/.tmux.conf \; \
  run-shell '~/.config/nvim/dotfiles/tmux/banner green 2000 "CONFIG RELOADED  ·  ~/.tmux.conf"' \; \
  run-shell -b 'msg=$(~/.config/scripts/tmux-cap-guard.sh --oneline 2>/dev/null); [ -n "$msg" ] && tmux display-message -d 8000 "⚠ $msg"; exit 0'

# ---------------------------------------------------------------------------
# No automatic renaming. Names I set stay set.
# ---------------------------------------------------------------------------
set -g allow-rename off
set -g automatic-rename off
set -g set-titles off

# ---------------------------------------------------------------------------
# FLOAT SIZE, REMEMBERED
# ---------------------------------------------------------------------------
# Generated by floax-size (prefix F / prefix M-f). Must be sourced LAST: it
# overrides the @floax-width/@floax-height defaults set further up, and the
# plugin's FLOAX_* env vars die with the tmux server, so this file is the only
# layer that makes a full-screen float survive a restart. -q so a fresh machine
# without the file is not an error.
source-file -q ~/.config/nvim/dotfiles/tmux/floax-size.conf
