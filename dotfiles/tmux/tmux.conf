# ==========================================
# 1. CORE SYSTEM CONFIGURATIONS & OVERRIDES
# ==========================================

# Change Prefix from Ctrl-b to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal capabilities. These must be set before plugins load, not after.
# terminal-features supersedes the old ",xterm-256color:Tc" override form:
#   RGB        truecolor (CRT/phosphor shader colors)
#   usstyle    undercurl + colored underlines in nvim
#   hyperlinks OSC 8 clickable links pass through to Ghostty
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB,*:usstyle,*:hyperlinks"

# Make tmux snappier (especially for Vim/Neovim Esc switching)
set -sg escape-time 0

# Forward terminal focus gain/loss to apps (nvim autoread, etc.)
set -g focus-events on

# Let apps' OSC sequences reach the terminal (Claude Code desktop notifications)
set -g allow-passthrough on

# Enable Mouse Support
set -g mouse on

# Scrollback depth. This was never set, so it silently sat on tmux's 2000-line
# default -- small enough that long build/test output scrolls away for good.
set -g history-limit 50000

# Vim-style copy mode settings
setw -g mode-keys vi
setw -g mode-style 'fg=#000000,bg=#a0ffff'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# u/d and C-u/C-d are SWAPPED against both tmux's defaults and the earlier
# binding here: the bare keys now scroll a HALF page, the Ctrl keys a FULL one.
# Rationale: bare u/d then match what C-u/C-d do in vim proper, so the reflex
# transfers with no modifier -- and the full page, which you reach for less
# often, is the one that costs a chord.
#
# This is safe HERE and only here. copy-mode-vi has no undo and no delete
# operator, so u and d carry no other meaning. Do NOT mirror this into Neovim:
# there u is undo and d is the delete operator that dd/dw/diw/dap are built on.
bind -T copy-mode-vi u   send -X halfpage-up
bind -T copy-mode-vi d   send -X halfpage-down
bind -T copy-mode-vi C-u send -X page-up
bind -T copy-mode-vi C-d send -X page-down
bind -T copy-mode-vi Escape send -X cancel
# Let C-h/C-j fall through to the root table so vim-tmux-navigator pane
# switching keeps working while copy mode is active.
unbind -T copy-mode-vi C-h
unbind -T copy-mode-vi C-j

# Use direct-cancel keys inside copy-mode search prompts, then restore the
# normal prompt key style. Escape closes only the search and returns to the
# same position in copy mode.
bind -T copy-mode-vi / \
  set-option -gqF @copy_search_status_keys '#{status-keys}' \; \
  set-option -gq status-keys emacs \; \
  command-prompt -T search -p '(search down)' { \
    send-keys -X search-forward -- '%%' \
  } \; \
  set-option -gqF status-keys '#{@copy_search_status_keys}' \; \
  set-option -gu @copy_search_status_keys
bind -T copy-mode-vi ? \
  set-option -gqF @copy_search_status_keys '#{status-keys}' \; \
  set-option -gq status-keys emacs \; \
  command-prompt -T search -p '(search up)' { \
    send-keys -X search-backward -- '%%' \
  } \; \
  set-option -gqF status-keys '#{@copy_search_status_keys}' \; \
  set-option -gu @copy_search_status_keys

# ==========================================
# 2. WINDOWS & PANES LAYOUTS
# ==========================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window activity, using tmux's own indicator and nothing else.
#
# monitor-activity ON means #{window_flags} adds `#` to a window that has
# emitted output since you last looked at it -- the same one-cell vocabulary as
# - last, ! bell, Z zoomed, M marked, * current. No custom glyph, no dot, no
# label recolouring: the flag run in window-status-format already renders it.
#
# window-status-activity-style is the one thing that must NOT stay stock here.
# tmux ships it as `reverse`, applied ON TOP of window-status-format, which
# swaps fg and bg and repaints the whole label as a filled slab identical to the
# active-window chip -- several windows then read as several current windows.
# `default` leaves the label alone so the `#` in the flag run is the signal.
#
# window-status-bell-style is deliberately LEFT stock at `reverse`. A bell is
# rare and deliberate -- a program decided you needed to know -- so the loud
# treatment is correct there, and it is the behaviour this config has always had.
#
# Caveat worth knowing: `#` is set by ANY output and clears only by visiting the
# window, so on a machine running agents and logs it will be lit often. That is
# tmux telling the truth about a noisy machine rather than a display bug.
set -g monitor-activity on
set -g window-status-activity-style default

# ==========================================
# STATUS BAR CUSTOMIZATION
# ==========================================

set -g status-position top

# Main status bar background matches terminal background
set -g status 2
set -g status-interval 15
set -g status-style "bg=default,fg=default"
set -g status-left-length 40
# status-right's length needs raising alongside status-left-length above -- it
# defaults to 40, which silently truncates a longer kube context (an EKS ARN,
# or gke_project_region_cluster) mid-string.
set -g status-right-length 100

# Window labels also blend with background
set -g window-status-style "bg=default,fg=default"
set -g @window_icon "#{?#{m/ri:repo|git,#{window_name}},󰙅,#{m/ri:nvim|vim,#{window_name}},󰌢,#{m/ri:k8s|kube|kubectl,#{window_name}},󱃾,#{m/ri:terraform|tf,#{window_name}},󱁢,#{m/ri:helm,#{window_name}},󰠳,#{m/ri:argo|argocd,#{window_name}},,#{m/ri:log|logs,#{window_name}},,#{m/ri:codex,#{window_name}},󰚩,#{m/ri:docker|compose,#{window_name}},󰡨,}"

# Every coloured piece of the bar lives in the block below, generated by
# `tmux-bar <color>` (bin/tmux-color) from the same pill_* palette the prompt
# uses. One colour in, two out: bright for the session cap, the active window,
# values and dividers; 48% of it for labels and inactive windows.
#
# Row 1 is dual-purpose. In resize mode it is the keybind cheatsheet; the rest
# of the time the else-branch draws a full-width rule in the dim colour -- a
# scanline under the bar that matches the pane dividers. The row was already
# allocated by `status 2`, so this costs nothing.
#
# Active window marker variants (edit the template in bin/tmux-color, not here):
#   Best:             > #{E:@window_icon} #I:#W  (arrow / chevron / bare >)
# >>> tmux-bar-managed >>>  DO NOT EDIT BY HAND -- rewritten by `tmux-bar`
# bright = #00e676   active / values / dividers
# dim    = #006e38   labels / inactive / unlit
set -g status-format[1] "#{?#{==:#{client_key_table},resize},#[fg=#00e676]#[bg=default]#[fg=#080808]#[bg=#00e676]#[bold] RESIZE #[fg=#00e676]#[bg=default]#[nobold]  #[fg=#00e676]#[bg=default]h/j/k/l#[fg=#006e38] 1 cell  ·  #[fg=#00e676]H/J/K/L#[fg=#006e38] 5 cells  ·  #[fg=#00e676]Esc / q / Enter#[fg=#006e38] done,#{?client_prefix,#[fg=#FF2E97]#[bg=default]#[fg=#080808]#[bg=#FF2E97]#[bold] WAIT#{@prefix_highlight_dots} #[fg=#FF2E97]#[bg=default]#[nobold]  #[fg=#00e676]|#[fg=#006e38] split  ·  #[fg=#00e676]-#[fg=#006e38] split  ·  #[fg=#00e676]o#[fg=#006e38] float  ·  #[fg=#00e676]g#[fg=#006e38] sesh  ·  #[fg=#00e676]f#[fg=#006e38] find  ·  #[fg=#00e676]/#[fg=#006e38] keys  ·  #[fg=#00e676]r#[fg=#006e38] resize  ·  #[fg=#00e676]t#[fg=#006e38] weather,#{?pane_in_mode,#[fg=#FF2E97]#[bg=default]#[fg=#080808]#[bg=#FF2E97]#[bold] COPY#{@prefix_highlight_dots} #[fg=#FF2E97]#[bg=default]#[nobold]  #[fg=#00e676]#{scroll_position}#[fg=#006e38] up  ·  #[fg=#00e676]n/N#[fg=#006e38] match  ·  #[fg=#00e676]v#[fg=#006e38] select  ·  #[fg=#00e676]y#[fg=#006e38] yank  ·  #[fg=#00e676]Esc#[fg=#006e38] out,#{?window_zoomed_flag,#[fg=#00e676]#[bg=default]#[fg=#080808]#[bg=#00e676]#[bold]  ZOOMED #[fg=#00e676]#[bg=default]#[nobold]  #[fg=#00e676]#{pane_current_command}#[fg=#006e38] · #{b:pane_current_path}  #[fg=#006e38]prefix z restores,#[fg=#00e676]#[bg=default]#{R:─,#{client_width}}}}}}"
set -g status-right "#[fg=#006e38]⎈ #(~/.config/nvim/dotfiles/tmux/kube-context)#[fg=#00e676] ╱  #[fg=#00e676]#(cd '#{pane_current_path}' 2>/dev/null && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo -)#[fg=#00e676] ╱ #[fg=#00e676,bold]%H:%M#[fg=#006e38] "
set -g window-status-separator "#[fg=#006e38]  #[default]"
set -g window-status-format "#[fg=#006e38]#[bg=default] #{E:@window_icon} #I:#W#{?window_flags,#{window_flags}, } #[default]"
set -g popup-border-style "fg=#006e38"
set -g menu-border-style  "fg=#006e38"
set -g @floax-border-color '#006e38'
set -g copy-mode-mark-style "bg=#00e676,fg=#080808"
set -g @ui-bright "#00e676"
set -g @ui-dim "#006e38"
set -g @ui-sunk "#002e17"
# <<< tmux-bar-managed <<<

# The session chip and the active-window chip are their own surface --
# `tmux-chip <color>`. Same colour as the bar reads as one piece; a
# different one makes the chips pop off it. Shapes are fixed either way.
# >>> tmux-chip-managed >>>  DO NOT EDIT BY HAND -- rewritten by `tmux-chip`
# bright = #00e676   active / values / dividers
# dim    = #006e38   labels / inactive / unlit
set -g status-left "#[fg=#080808,bg=#00e676,bold] #(echo '#{session_name}' | tr a-z A-Z) #[fg=#00e676,bg=default,nobold]#[default] "
set -g window-status-current-style "bg=default,fg=#00e676,bold"
set -g window-status-current-format "#[fg=#00e676,bg=default]#[fg=#080808,bg=#00e676,bold] > #[fg=#080808,bg=#00e676,bold]#{E:@window_icon} #I:#W#{?window_zoomed_flag, ,} #[fg=#00e676,bg=default,nobold]#[default]"
# <<< tmux-chip-managed <<<

# set -g status-style bg=180
# Windows management (keeping current directory path)
bind c new-window -c "#{pane_current_path}"

# Ctrl-y toggles a narrow YouTube column in the current window: search above,
# inline video below. Prefix-y is intentionally retired -- it needs no unbind,
# having no default binding in the first place. The same was true of the
# unbinds that used to sit here for g, u and a: all four were no-ops. Note that
# an unbind here cannot undo a plugin's key anyway, since TPM runs at the foot
# of this file; that is what the post-plugin override block near the end is for.
unbind -n C-y
bind -n C-y run-shell '~/.config/nvim/dotfiles/tmux/yt-corner "#{pane_id}" "#{window_id}"'
# Cmd+h/l/; and Cmd+Shift+; from Ghostty send custom CSI sequences registered as tmux user keys.
set -s user-keys[0] "\e[5;30012~"
set -s user-keys[1] "\e[5;30013~"
set -s user-keys[2] "\e[5;30014~"
set -s user-keys[3] "\e[5;30015~"
bind -n User0 previous-window
bind -n User1 next-window
bind -n User2 last-window
bind -n User3 switch-client -l

# Alt/Option fallback for keyboards that send terminal Meta.
bind -n M-h previous-window
bind -n M-l next-window
bind w choose-tree -Zw -F '#{window_index}: #{window_name}#{window_flags}'

# sesh: zoxide-backed session/dir switcher in a popup. Prefix-g ("go").
# Lowercase s stays the built-in session chooser; this is additive.
# The [ -n ] guard keeps a cancelled fzf from calling `sesh connect ""`.
bind g display-popup -E -x C -y 2 -w 60% -h 60% \
  'sel=$(sesh list --icons | fzf --ansi --no-sort --reverse \
     --prompt="  " --pointer="▸" --border=none \
     --color="bg+:$(tmux show -gv @ui-sunk),fg+:$(tmux show -gv @ui-bright),pointer:#FF2E97,prompt:$(tmux show -gv @ui-bright),border:$(tmux show -gv @ui-dim)"); \
   [ -n "$sel" ] && sesh connect "$sel"'

# Save the session with Resurrect and show its confirmation banner. Lowercase s
# stays the built-in session chooser; Prefix-Ctrl-s still works too, that being
# tmux-resurrect's own default save key (not TPM's -- TPM uses I / U / M-u).
bind S run-shell '~/.config/nvim/dotfiles/tmux/session-save'

# Search the custom terminal keybind reference in a self-closing popup.
# -b none for the same reason as `bind f` below: the keys palette draws its own
# rounded, labelled fzf frame (keybind-palette.zsh, --border=rounded
# --border-label=' KEYBIND REFERENCE '), so tmux's popup frame stacked a second
# box around it. That doubling was invisible while the popup-clipping bug ate
# tmux's top border rows, and became obvious once the patched tmux drew them.
bind / display-popup -E -b none -x C -y C -w 92% -h 88% -d "#{pane_current_path}" \
  "zsh -f -c 'source ~/.config/nvim/dotfiles/zsh/terminal-tools.zsh; keys'"

# Search text visible across every pane, then jump directly to the match.
unbind f
# -b none: this script's fzf draws its own rounded, labelled border, so tmux's
# popup frame would stack a second box outside it. One border, not two.
bind f display-popup -E -b none -x C -y 2 -w 95% -h 88% \
  '~/.config/nvim/dotfiles/tmux/pane-content-picker'

# Open the terminal Messages client below the two-line top status.
bind m display-popup -E -x C -y 2 -w 90% -h 88% -d "#{pane_current_path}" '~/.config/bin/msg'

# Hourly weather for San Jose (replaces the built-in clock-mode on prefix t).
#
# UPSTREAM BUG, PATCHED LOCALLY -- this binding needs no workaround.
# tmux 3.7b clipped popups AND menus against a rectangle displaced downward by
# the number of TOP status lines, so with status-position top + `status 2` the
# top TWO rows were unguarded: a pane writing output while a popup was open
# painted over them and ate the ╭───╮ border. Rows lost == top status-line count.
# Cause: screen-redraw.c:1369 asks tty_check_overlay_range() about window-space
# `wy` but draws at tty-space `py`; with a top status bar those differ by exactly
# the status-line count. Fixed in the local build (4 hunks in screen-redraw.c,
# plus an out-of-bounds ranges read in popup.c:259). Verified by tmux's own -vv
# redraw log and a rendered-screen harness at status 1/2/3, top and bottom.
#
# Do NOT "fix" this in config by pinning -y 0. That only moves the popup's top
# rows onto the status bar, trading pane-bleed for status-bleed -- status-interval
# and mode-dots-loop's refresh-client -S repaint the bar over the rounded corners
# -- and it costs the centring too. Config cannot fix this; only the patch can.
unbind t
bind t display-popup -E -x C -y C -w 90 -h 19 '~/.config/nvim/dotfiles/tmux/weather --popup'

# Split panes natively using visual pipes/dashes
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Jump to last-used pane/window
bind-key ';' last-pane
bind-key 'C-;' last-pane
bind -n M-';' last-window
# Navigate between panes cleanly using lowercase Vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-tmux-navigator: Ctrl+h/j/k/l crosses nvim splits AND tmux panes seamlessly.
# If the focused pane is running vim/nvim/fzf, forward the key; otherwise switch panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
# Ctrl+l is now claimed above, so keep clear-screen on prefix + Ctrl+l
bind C-l send-keys 'C-l'

# Resize panes fluidly using repeatable Capital Vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Persistent pane-resize mode. Prefix-r enters; movement stays in this table
# until Escape, q, or Enter explicitly returns the client to normal keys.
bind r switch-client -T resize \; refresh-client -S
bind -T resize h resize-pane -L 1 \; switch-client -T resize
bind -T resize j resize-pane -D 1 \; switch-client -T resize
bind -T resize k resize-pane -U 1 \; switch-client -T resize
bind -T resize l resize-pane -R 1 \; switch-client -T resize
bind -T resize H resize-pane -L 5 \; switch-client -T resize
bind -T resize J resize-pane -D 5 \; switch-client -T resize
bind -T resize K resize-pane -U 5 \; switch-client -T resize
bind -T resize L resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root \; refresh-client -S
bind -T resize q switch-client -T root \; refresh-client -S
bind -T resize Enter switch-client -T root \; refresh-client -S

# Reload tmux configuration safely
unbind R
# Two-stage banner: acid lime while sourcing, pure green once it lands. The
# banner helper inlines its own colors (including fill=, which is what spans the
# full line), so nothing here has to touch the global message-style.
bind R \
  run-shell '~/.config/nvim/dotfiles/tmux/banner lime 0 "RELOADING CONFIG…"' \; \
  source-file ~/.tmux.conf \; \
  run-shell '~/.config/nvim/dotfiles/tmux/banner green 2000 "CONFIG RELOADED  ·  ~/.tmux.conf"'

# ==========================================
# 2b. UI POLISH (tmux 3.5+ surfaces)
# HUE CARRIES MEANING. BRIGHTNESS CARRIES STATE.
#
# The accents are no longer fixed here -- four surfaces are generated by
# ~/.local/bin/tmux-color (tmux-bar / tmux-chip / tmux-pane / tmux-pane-lines),
# one colour in and two out: BRIGHT as given, DIM at 48%. Chasing a hex in this
# file is how the palette used to fall out of sync; read the managed blocks.
#
# What is FIXED, because it means something no colour picker may override:
#   #FF2E97 synth pink  MODE -- prefix-wait, copy mode, command prompt, menus
#   #FF8500 orange      BLAST RADIUS -- prod kube context, ssh/sudo pane pill.
#                       The brightest fully saturated value that still reads
#                       orange; #FF9100 crosses to hue 34 and reads amber.
#   #00FF33 pure green  DONE -- saved / reloaded (message-style, user's own)
#   #a0ffff pale ice    copy-mode selection + match (user's own)
#   #080808 void        knockout text on any lit slab
#
# The ON/OFF ratio is the active-pane indicator itself: tmux signals focus by
# LIGHTING a border, which is a brightness step, not a hue step. #00ffff once
# shipped as the INACTIVE colour, out-glowed the active orange, and inverted the
# signal -- the UI read as broken. Print both luminances before adding a pair.
#
# RETIRED, and drift if seen again: #2ff5ff / #22949f cyan, #ACFF00 acid lime,
# #FFA500 amber, #0d3238 slate.
# ==========================================

# --- Popups & menus -----------------------------------------------------
# Rounded corners on the weather / messages / pane-picker / keys popups.
set -g popup-border-lines rounded
# popup-border-style is generated -- see the tmux-bar-managed block
set -g popup-style        "bg=default"
set -g menu-border-lines  rounded
# menu-border-style is generated -- see the tmux-bar-managed block
set -g menu-style         "bg=default,fg=default"
# Default was a screaming bg=yellow,fg=black.
set -g menu-selected-style "bg=#FF2E97,fg=#080808,bold"

# --- Messages -----------------------------------------------------------
# Two-state banner scheme:
#   #93FF12 (acid lime)  = in flight -- working, prompting, searching
#   #00FF33 (pure green) = done -- saved / reloaded / succeeded
# Text is #000000, the darkest possible, for max contrast on both.
#
# fill= IS REQUIRED and must match bg. Without it tmux paints the bar only as
# wide as the message text, so short messages became stubs and animated ones
# (resurrect's spinner, the search prompt as you type) visibly changed width on
# every keystroke. tmux's own default carries it -- "bg=yellow,fg=black,
# fill=yellow" -- and overriding the style without fill is what dropped it.
# This covers every message and prompt globally; nothing needs manual padding.
set -g message-style         "bg=#00FF33,fg=#000000,bold,fill=#00FF33"
set -g message-command-style "bg=#FF2E97,fg=#080808,bold,fill=#FF2E97"

# NOTE: the grey foreground now lives in Ghostty (`foreground = #8E989E`) so it
# applies globally, in and out of tmux. Deliberately NOT overridden here --
# adding window-style fg= would mask the global value inside tmux only.

# --- Pane borders -------------------------------------------------------
# NB: pane-border-lines takes single|double|heavy|simple|number|spaces only --
# "rounded" is valid for popup/menu borders but NOT here.
set -g pane-border-lines      single
#
# 'both' = tmux's own arrow markers, restored by request.
# KNOWN BEHAVIOUR, not a bug: with pane-border-status top tmux draws an arrow
# on EVERY pane's title bar, so two panes show two arrows. The arrow therefore
# marks "a pane starts here", not "this pane is active" -- the orange brackets
# in pane-border-format below are what actually flag the active pane.
# Set to 'colour' for zero arrows if the doubling ever annoys you.
set -g pane-border-indicators both
#
# THE RULE THESE TWO MUST OBEY: tmux signals the active pane by lighting a
# border, so the pair has to read as UNLIT vs LIT -- a brightness step. Hue
# contrast alone does NOT work. Verified by probe: with exactly two panes tmux
# splits the single shared divider, drawing the half nearest the active pane in
# pane-active-border-style and the rest in pane-border-style. If both colours
# are equally bright the split reads as two competing lines, not as one line
# half-lit, and the indicator is destroyed. #00ffff as the INACTIVE colour did
# exactly that -- it out-glowed the active orange and inverted the signal.
#
# So: inactive is the SAME cyan hue as ACTIVE_INDENT_SCOPE in nvim's theme.lua
# (keeping a tmux divider and an nvim scope guide visually related) but dimmed
# hard, so it reads as the glow line at rest. Active is bright orange, which is
# unambiguously the brighter of the two.
#
# NB: the arrow marker has NO colour option of its own -- it is drawn from
# pane-active-border-style, the same option as the lit half. A cyan divider
# with an orange arrow is therefore NOT expressible in tmux. Don't retry it.
# ON / OFF pair. Same hue, brightness carries the state (see the rule above).
# Both values are generated at DIM_SCALE = 0.48, which is the ratio the
# hand-tuned pairs used before the generator existed:
#   #FF8500 / #7a4000   L 0.380 / 0.078   4.9x
#   #03FC45 / #017a22   L 0.701 / 0.140   5.0x
# Target the 4-6x band. Do not raise OFF past ~L=0.30 or the lit/unlit read
# collapses and the active-pane indicator stops working.
# >>> tmux-pane-lines-managed >>>  DO NOT EDIT BY HAND -- rewritten by `tmux-pane-lines`
# bright = #ff6a00   active / values / dividers
# dim    = #7a3200   labels / inactive / unlit
set -g pane-border-style        "fg=#7a3200"
set -g pane-active-border-style "fg=#ff6a00"
set -g pane-scrollbars-style "bg=#331500,fg=#7a3200,width=1,pad=0"
# <<< tmux-pane-lines-managed <<<

# >>> tmux-pane-managed >>>  DO NOT EDIT BY HAND -- rewritten by `tmux-pane`
# bright = #ff8c1a   active / values / dividers
# dim    = #7a430c   labels / inactive / unlit
set -g pane-border-format "──#{?#{m/r:^(ssh|mosh|sudo|doas|su)$,#{pane_current_command}},#{?pane_active,#[fg=#FF8500]#[fg=#080808#,bg=#FF8500#,bold],#[fg=#7a4000]#[fg=#080808#,bg=#7a4000]}󰢹 ,#{?pane_active,#[fg=#ff8c1a]#[fg=#080808#,bg=#ff8c1a#,bold],#[fg=#7a430c]#[fg=#080808#,bg=#7a430c]}}#{pane_current_command} · #{b:pane_current_path}#{?#{m/r:^(ssh|mosh|sudo|doas|su)$,#{pane_current_command}},#{?pane_active,#[fg=#FF8500#,bg=default#,nobold],#[fg=#7a4000#,bg=default#,nobold]},#{?pane_active,#[fg=#ff8c1a#,bg=default#,nobold],#[fg=#7a430c#,bg=default#,nobold]}}#[default]#{?#{mouse},#[align=right]#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange]#[range=control|9][x]#[norange],}"
set -g display-panes-colour        "#7a430c"
set -g display-panes-active-colour "#ff8c1a"
set -g clock-mode-colour           "#ff8c1a"
# <<< tmux-pane-managed <<<

# Two blocks, two commands, on purpose: `tmux-pane-lines <color>` owns the
# rules (borders + scrollbar), `tmux-pane <color>` owns the titles (the pill,
# pane numbers, the clock). Set them to the same colour for one surface, or
# different ones for a lit pill on a quiet divider. Notes on each kept below.

# Pane titles in the top border.
set -g pane-border-status top

# BRACKETED ACTIVE TITLE -- the real active-pane indicator.
#
# tmux's built-in arrow is drawn from pane-active-border-style and so can never
# be a different colour from the bar. pane-border-format CAN take its own
# #[fg=] escapes plus #{?pane_active,,} conditionals, so the brackets are
# orange while the bar stays icy, and they appear on the ACTIVE PANE ONLY.
#
# GOTCHA: a comma inside #[...] must be escaped as "#," or tmux reads it as the
# separator of the enclosing #{?...} conditional. Hence "#[fg=#FF8500#,bold]".
# The templates avoid this entirely by writing each style as its own #[..]
# block -- no commas, nothing to escape. Only pane-border-format still needs
# the escapes, because its slab styles genuinely are comma-joined.
#
# Trailing #{?#{mouse},...} is tmux's stock clickable [z] zoom / [x] kill
# buttons, kept as-is.
#
# Swap the bracket pair freely -- ⟪⟫  ⟨⟩  «»  [ ]  ❰❱  ⌜⌟

# Faint dot grid in the unused region of a pane.
# prefix+q pane numbers and the clock were still on tmux's stock blue/red.

set -g fill-character '·'

# --- Scrollbars (3.5+) --------------------------------------------------
# modal = scrollbar appears only in copy mode, so normal panes stay clean.
# ('on' for always-visible, 'off' to disable.)
set -g pane-scrollbars modal
set -g pane-scrollbars-position right

# --- Copy-mode search ---------------------------------------------------
# Defaults were stock cyan/magenta, clashing with the #a0ffff selection.
# Matches are bright teal; the slate #42545d used here before read as "greyed out".
set -g copy-mode-match-style         "bg=#a0ffff,fg=#000000,bold"
set -g copy-mode-current-match-style "bg=#FF8500,fg=#080808,bold"
# copy-mode-mark-style is generated -- see the tmux-bar-managed block

# ==========================================
# 3. TMUX PLUGIN MANAGER (TPM) & PLUGINS
# ==========================================

# Declare targeted Git repositories for plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'omerxx/tmux-floax'

# extrakto: Prefix-Tab fuzzy-picks any token on screen (paths, URLs, hashes)
# straight into the buffer. Uses the fzf + python3 already on this machine.
set -g @extrakto_key 'Tab'
set -g @extrakto_split_direction 'p'          # render into a popup, not a split
set -g @extrakto_popup_size '65%'
set -g @extrakto_clip_tool 'pbcopy'
set -g @extrakto_fzf_tool '/opt/homebrew/bin/fzf'

# tmux-floax: toggleable floating scratch pane.
# Kept on 'o' rather than its default 'p'. The original reason was a collision
# with pomodoro, now removed, so 'p' is free again -- but 'o' is in the fingers.
# It only shadows the built-in select-pane -t :.+, which h/j/k/l already covers.
# NB: floax also binds 'P' for its menu (@floax-bind-menu), unconditionally.
set -g @floax-bind 'o'
# floax's float lives in its own session. Its default name is 'scratch', which
# collides with the session `bind T` creates -- P's menu then treats real work
# windows as the float and moves them into it.
set -g @floax-session-name 'floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
# @floax-border-color is generated -- see the tmux-bar-managed block
set -g @floax-text-color 'default'
set -g @floax-change-path 'true'

# 3. Enable automatic environment restoration on startup
set -g @continuum-restore 'on'

# 4. Optional: Change the auto-save interval (Default is 15 minutes)
set -g @continuum-save-interval '5'

# Prefix highlight styling
set -g @prefix_highlight_fg '#080808'
set -g @prefix_highlight_bg '#FF2E97'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#080808,bg=#FF2E97,bold'
set -g @prefix_highlight_dots ''
set -g @prefix_highlight_prefix_prompt 'WAIT#{@prefix_highlight_dots}'
set -g @prefix_highlight_copy_prompt 'COPY#{@prefix_highlight_dots}'
set -g @prefix_highlight_sync_prompt 'SYNC#{@prefix_highlight_dots}'
set -g @prefix_highlight_output_prefix '#[fg=#FF2E97]#[bg=default]#[fg=#080808]#[bg=#FF2E97]#[bold]'
set -g @prefix_highlight_output_suffix '#[fg=#FF2E97]#[bg=default]#[nobold]'

# CRITICAL: tpm reads every configuration written above it and applies the
# plugin logic, so all @plugin and @option lines must precede it. The only
# thing that may follow is the override block below -- a plugin binding can be
# undone only after the plugin has installed it.

run-shell -b 'sh "$HOME/.config/nvim/dotfiles/tmux/mode-dots-loop"'

run '~/.tmux/plugins/tpm/tpm'

# --- Post-plugin overrides ----------------------------------------------
# Drop floax's menu (@floax-bind-menu, hardcoded to P -- no option disables
# it). Every item on that menu -- size up/down, full screen, reset, embed --
# is already a C-M-* key that floax binds while the float is open, which is
# the only time those actions apply. From outside the float the menu offers
# just "pop current window", which moves the current window into the floax
# session and destroys its origin session if it was the last window there.
# That is how the DevOps session was lost on 2026-07-19. Prefix-o, the actual
# toggle, is untouched.
unbind P
