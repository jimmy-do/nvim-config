# ==========================================
# 1. CORE SYSTEM CONFIGURATIONS & OVERRIDES
# ==========================================

# Change Prefix from Ctrl-b to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal capabilities. These must be set before plugins load, not after.
# terminal-features supersedes the old ",xterm-256color:Tc" override form:
#   RGB        truecolor (CRT/phosphor shader colors)
#   usstyle    undercurl + colored underlines in nvim
#   hyperlinks OSC 8 clickable links pass through to Ghostty
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB,*:usstyle,*:hyperlinks"

# Make tmux snappier (especially for Vim/Neovim Esc switching)
set -sg escape-time 0

# Forward terminal focus gain/loss to apps (nvim autoread, etc.)
set -g focus-events on

# Let apps' OSC sequences reach the terminal (Claude Code desktop notifications)
set -g allow-passthrough on

# Enable Mouse Support
set -g mouse on

# Scrollback depth. This was never set, so it silently sat on tmux's 2000-line
# default -- small enough that long build/test output scrolls away for good.
set -g history-limit 50000

# Vim-style copy mode settings
setw -g mode-keys vi
setw -g mode-style 'fg=#000000,bg=#a0ffff'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi u send -X page-up
bind -T copy-mode-vi d send -X page-down
bind -T copy-mode-vi Escape send -X cancel
# Let C-h/C-j fall through to the root table so vim-tmux-navigator pane
# switching keeps working while copy mode is active.
unbind -T copy-mode-vi C-h
unbind -T copy-mode-vi C-j

# Use direct-cancel keys inside copy-mode search prompts, then restore the
# normal prompt key style. Escape closes only the search and returns to the
# same position in copy mode.
bind -T copy-mode-vi / \
  set-option -gqF @copy_search_status_keys '#{status-keys}' \; \
  set-option -gq status-keys emacs \; \
  command-prompt -T search -p '(search down)' { \
    send-keys -X search-forward -- '%%' \
  } \; \
  set-option -gqF status-keys '#{@copy_search_status_keys}' \; \
  set-option -gu @copy_search_status_keys
bind -T copy-mode-vi ? \
  set-option -gqF @copy_search_status_keys '#{status-keys}' \; \
  set-option -gq status-keys emacs \; \
  command-prompt -T search -p '(search up)' { \
    send-keys -X search-backward -- '%%' \
  } \; \
  set-option -gqF status-keys '#{@copy_search_status_keys}' \; \
  set-option -gu @copy_search_status_keys

# ==========================================
# 2. WINDOWS & PANES LAYOUTS
# ==========================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ==========================================
# STATUS BAR CUSTOMIZATION
# ==========================================

set -g status-position top

# Main status bar background matches terminal background
set -g status 2
set -g status-interval 15
set -g status-style "bg=default,fg=default"
set -g status-format[1] "#{?#{==:#{client_key_table},resize},#[fg=#111111]#[bg=#a0ffff]#[bold]  RESIZE  #[fg=#a0ffff]#[bg=default]#[nobold]  #[fg=#a0ffff]#[bg=default]h/j/k/l#[fg=default] 1 cell  ·  #[fg=#f4933b]H/J/K/L#[fg=default] 5 cells  ·  #[fg=#dee22a]Esc / q / Enter#[fg=default] done,#[fg=#5b7078]#[bg=default]#{R:─,#{client_width}}}"

# Left status: session name + prefix highlight + clean spacing before windows
set -g status-left "#[fg=#dee22a,bg=#42545d,bold] #S #[fg=#42545d,bg=default,nobold]#[default] #{prefix_highlight} "
set -g status-left-length 40

# Right status: Kubernetes context. The length needs raising alongside
# status-left-length above -- it defaults to 40, which silently truncates a
# longer context (an EKS ARN, or gke_project_region_cluster) mid-string.
set -g status-right "#[fg=default,bg=default] ⎈ #(kubectl config current-context 2>/dev/null || echo 'No K8s Context') "
set -g status-right-length 100

# Window labels also blend with background
set -g window-status-style "bg=default,fg=default"
set -g window-status-separator "#[fg=#5b7078,bold] │ #[default]"
set -g @window_icon "#{?#{m/ri:repo|git,#{window_name}},󰙅,#{m/ri:nvim|vim,#{window_name}},󰌢,#{m/ri:k8s|kube|kubectl,#{window_name}},󱃾,#{m/ri:terraform|tf,#{window_name}},󱁢,#{m/ri:helm,#{window_name}},󰠳,#{m/ri:argo|argocd,#{window_name}},,#{m/ri:log|logs,#{window_name}},,#{m/ri:codex,#{window_name}},󰚩,#{m/ri:docker|compose,#{window_name}},󰡨,}"
set -g window-status-format "#[fg=default,bg=default] #{E:@window_icon} #I:#W#{?window_flags,#{window_flags}, } #[default]"
set -g window-status-current-style "bg=default,fg=#f4933b,bold"
# Active window marker variants:
#   Best:             → #{E:@window_icon} #I:#W
#   Minimal chevron:  ▸ #{E:@window_icon} #I:#W
#   Pure shell vibe:  > #{E:@window_icon} #I:#W
set -g window-status-current-format "#[fg=#575953,bg=default]#[fg=#dee22a,bg=#575953,bold] > #[fg=#f4933b,bg=#575953,bold]#{E:@window_icon} #I:#W #[fg=#575953,bg=default,nobold]#[default]"

# set -g status-style bg=180
# Windows management (keeping current directory path)
bind c new-window -c "#{pane_current_path}"

# Ctrl-y toggles a narrow YouTube column in the current window: search above,
# inline video below. Prefix-y is intentionally retired.
unbind g
unbind u
unbind a
unbind y
unbind -n C-y
bind -n C-y run-shell '~/.config/nvim/dotfiles/tmux/yt-corner "#{pane_id}" "#{window_id}"'
# Cmd+h/l/; and Cmd+Shift+; from Ghostty send custom CSI sequences registered as tmux user keys.
set -s user-keys[0] "\e[5;30012~"
set -s user-keys[1] "\e[5;30013~"
set -s user-keys[2] "\e[5;30014~"
set -s user-keys[3] "\e[5;30015~"
bind -n User0 previous-window
bind -n User1 next-window
bind -n User2 last-window
bind -n User3 switch-client -l

# Alt/Option fallback for keyboards that send terminal Meta.
bind -n M-h previous-window
bind -n M-l next-window
bind w choose-tree -Zw -F '#{window_index}: #{window_name}#{window_flags}'

# sesh: zoxide-backed session/dir switcher in a popup. Prefix-g ("go").
# Lowercase s stays the built-in session chooser; this is additive.
# The [ -n ] guard keeps a cancelled fzf from calling `sesh connect ""`.
bind g display-popup -E -x C -y 2 -w 60% -h 60% \
  'sel=$(sesh list --icons | fzf --ansi --no-sort --reverse \
     --prompt="  " --pointer="▸" --border=none \
     --color="bg+:#575953,fg+:#dee22a,pointer:#f4933b,prompt:#7daea3"); \
   [ -n "$sel" ] && sesh connect "$sel"'

# Save the session with Resurrect and show its confirmation banner. Lowercase s
# stays the built-in session chooser; Prefix-Ctrl-s still works too, that being
# tmux-resurrect's own default save key (not TPM's -- TPM uses I / U / M-u).
bind S run-shell '~/.config/nvim/dotfiles/tmux/session-save'

# Search the custom terminal keybind reference in a self-closing popup.
bind / display-popup -E -w 92% -h 88% -d "#{pane_current_path}" \
  "zsh -f -c 'source ~/.config/nvim/dotfiles/zsh/terminal-tools.zsh; keys'"

# Search text visible across every pane, then jump directly to the match.
unbind f
# -b none: this script's fzf draws its own rounded, labelled border, so tmux's
# popup frame would stack a second box outside it. One border, not two.
bind f display-popup -E -b none -x C -y 2 -w 95% -h 88% \
  '~/.config/nvim/dotfiles/tmux/pane-content-picker'

# Open the terminal Messages client below the two-line top status.
bind m display-popup -E -x C -y 2 -w 90% -h 88% -d "#{pane_current_path}" '~/.config/bin/msg'

# Hourly weather for San Jose (replaces the built-in clock-mode on prefix t).
unbind t
bind t display-popup -E -x C -y C -w 90 -h 19 '~/.config/nvim/dotfiles/tmux/weather --popup'

# Split panes natively using visual pipes/dashes
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Jump to last-used pane/window
bind-key ';' last-pane
bind-key 'C-;' last-pane
bind -n M-';' last-window
# Navigate between panes cleanly using lowercase Vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-tmux-navigator: Ctrl+h/j/k/l crosses nvim splits AND tmux panes seamlessly.
# If the focused pane is running vim/nvim/fzf, forward the key; otherwise switch panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
# Ctrl+l is now claimed above, so keep clear-screen on prefix + Ctrl+l
bind C-l send-keys 'C-l'

# Resize panes fluidly using repeatable Capital Vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Persistent pane-resize mode. Prefix-R enters; movement stays in this table
# until Escape, q, or Enter explicitly returns the client to normal keys.
bind R switch-client -T resize \; refresh-client -S
bind -T resize h resize-pane -L 1 \; switch-client -T resize
bind -T resize j resize-pane -D 1 \; switch-client -T resize
bind -T resize k resize-pane -U 1 \; switch-client -T resize
bind -T resize l resize-pane -R 1 \; switch-client -T resize
bind -T resize H resize-pane -L 5 \; switch-client -T resize
bind -T resize J resize-pane -D 5 \; switch-client -T resize
bind -T resize K resize-pane -U 5 \; switch-client -T resize
bind -T resize L resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root \; refresh-client -S
bind -T resize q switch-client -T root \; refresh-client -S
bind -T resize Enter switch-client -T root \; refresh-client -S

# Reload tmux configuration safely
unbind r
# Two-stage banner: acid lime while sourcing, pure green once it lands. The
# banner helper inlines its own colors (including fill=, which is what spans the
# full line), so nothing here has to touch the global message-style.
bind r \
  run-shell '~/.config/nvim/dotfiles/tmux/banner lime 0 "RELOADING CONFIG…"' \; \
  source-file ~/.tmux.conf \; \
  run-shell '~/.config/nvim/dotfiles/tmux/banner green 2000 "CONFIG RELOADED  ·  ~/.tmux.conf"'

# ==========================================
# 2b. UI POLISH (tmux 3.5+ surfaces)
# Palette reference: #dee22a yellow · #f4933b orange · #a0ffff cyan
#                    #42545d slate  · #575953 grey   · #5b7078 hairline
# ==========================================

# --- Popups & menus -----------------------------------------------------
# Rounded corners on the weather / messages / pane-picker / keys popups.
set -g popup-border-lines rounded
set -g popup-border-style "fg=#5b7078"
set -g popup-style        "bg=default"
set -g menu-border-lines  rounded
set -g menu-border-style  "fg=#5b7078"
set -g menu-style         "bg=default,fg=default"
# Default was a screaming bg=yellow,fg=black.
set -g menu-selected-style "bg=#575953,fg=#dee22a,bold"

# --- Messages -----------------------------------------------------------
# Two-state banner scheme:
#   #93FF12 (acid lime)  = in flight -- working, prompting, searching
#   #00FF33 (pure green) = done -- saved / reloaded / succeeded
# Text is #000000, the darkest possible, for max contrast on both.
#
# fill= IS REQUIRED and must match bg. Without it tmux paints the bar only as
# wide as the message text, so short messages became stubs and animated ones
# (resurrect's spinner, the search prompt as you type) visibly changed width on
# every keystroke. tmux's own default carries it -- "bg=yellow,fg=black,
# fill=yellow" -- and overriding the style without fill is what dropped it.
# This covers every message and prompt globally; nothing needs manual padding.
set -g message-style         "bg=#00FF33,fg=#000000,bold,fill=#00FF33"
set -g message-command-style "bg=#93FF12,fg=#000000,bold,fill=#93FF12"

# NOTE: the grey foreground now lives in Ghostty (`foreground = #8E989E`) so it
# applies globally, in and out of tmux. Deliberately NOT overridden here --
# adding window-style fg= would mask the global value inside tmux only.

# --- Pane borders -------------------------------------------------------
# NB: pane-border-lines takes single|double|heavy|simple|number only --
# "rounded" is valid for popup/menu borders but NOT here.
set -g pane-border-lines      single
set -g pane-border-indicators both
set -g pane-border-style        "fg=#3a464c"
set -g pane-active-border-style "fg=#f4933b"

# Faint dot grid in the unused region of a pane.
set -g fill-character '·'

# --- Scrollbars (3.5+) --------------------------------------------------
# modal = scrollbar appears only in copy mode, so normal panes stay clean.
# ('on' for always-visible, 'off' to disable.)
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style "bg=#2a3339,fg=#5b7078,width=1,pad=0"

# --- Copy-mode search ---------------------------------------------------
# Defaults were stock cyan/magenta, clashing with the #a0ffff selection.
# Matches are bright teal; the slate #42545d used here before read as "greyed out".
set -g copy-mode-match-style         "bg=#a0ffff,fg=#000000,bold"
set -g copy-mode-current-match-style "bg=#f4933b,fg=#000000,bold"
set -g copy-mode-mark-style          "bg=#7daea3,fg=#32302f"

# ==========================================
# 3. TMUX PLUGIN MANAGER (TPM) & PLUGINS
# ==========================================

# Declare targeted Git repositories for plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'omerxx/tmux-floax'

# extrakto: Prefix-Tab fuzzy-picks any token on screen (paths, URLs, hashes)
# straight into the buffer. Uses the fzf + python3 already on this machine.
set -g @extrakto_key 'Tab'
set -g @extrakto_split_direction 'p'          # render into a popup, not a split
set -g @extrakto_popup_size '65%'
set -g @extrakto_clip_tool 'pbcopy'
set -g @extrakto_fzf_tool '/opt/homebrew/bin/fzf'

# tmux-floax: toggleable floating scratch pane.
# Kept on 'o' rather than its default 'p'. The original reason was a collision
# with pomodoro, now removed, so 'p' is free again -- but 'o' is in the fingers.
# It only shadows the built-in select-pane -t :.+, which h/j/k/l already covers.
# NB: floax also binds 'P' for its menu (@floax-bind-menu), unconditionally.
set -g @floax-bind 'o'
# floax's float lives in its own session. Its default name is 'scratch', which
# collides with the session `bind T` creates -- P's menu then treats real work
# windows as the float and moves them into it.
set -g @floax-session-name 'floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#5b7078'
set -g @floax-text-color 'default'
set -g @floax-change-path 'true'

# 3. Enable automatic environment restoration on startup
set -g @continuum-restore 'on'

# 4. Optional: Change the auto-save interval (Default is 15 minutes)
set -g @continuum-save-interval '5'

# Prefix highlight styling
set -g @prefix_highlight_fg '#32302f'
set -g @prefix_highlight_bg '#7daea3'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#32302f,bg=#7daea3,nobold'
set -g @prefix_highlight_dots ''
set -g @prefix_highlight_prefix_prompt 'WAIT#{@prefix_highlight_dots}'
set -g @prefix_highlight_copy_prompt 'COPY#{@prefix_highlight_dots}'
set -g @prefix_highlight_sync_prompt 'SYNC#{@prefix_highlight_dots}'
set -g @prefix_highlight_output_prefix '#[fg=#7daea3]#[bg=default]#[fg=#32302f]#[bg=#7daea3]#[nobold]'
set -g @prefix_highlight_output_suffix '#[fg=#7daea3]#[bg=default]#[nobold]'

# CRITICAL: tpm reads every configuration written above it and applies the
# plugin logic, so all @plugin and @option lines must precede it. The only
# thing that may follow is the override block below -- a plugin binding can be
# undone only after the plugin has installed it.

run-shell -b 'sh "$HOME/.config/nvim/dotfiles/tmux/mode-dots-loop"'

run '~/.tmux/plugins/tpm/tpm'

# --- Post-plugin overrides ----------------------------------------------
# Drop floax's menu (@floax-bind-menu, hardcoded to P -- no option disables
# it). Every item on that menu -- size up/down, full screen, reset, embed --
# is already a C-M-* key that floax binds while the float is open, which is
# the only time those actions apply. From outside the float the menu offers
# just "pop current window", which moves the current window into the floax
# session and destroys its origin session if it was the last window there.
# That is how the DevOps session was lost on 2026-07-19. Prefix-o, the actual
# toggle, is untouched.
unbind P
